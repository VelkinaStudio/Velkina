<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Marmara Foods Google Ads dashboard mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0E12"/>
      <stop offset="100%" stop-color="#1A1422"/>
    </linearGradient>
    <radialGradient id="glow8" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0"/>
