          <rect x="30" y="112" width="20" height="48"/>
          <rect x="58" y="100" width="20" height="60"/>
          <rect x="86" y="108" width="20" height="52"/>
          <rect x="114" y="92" width="20" height="68"/>
          <rect x="142" y="88" width="20" height="72"/>
          <rect x="170" y="80" width="20" height="80"/>
          <rect x="198" y="84" width="20" height="76"/>
          <rect x="226" y="72" width="20" height="88"/>
          <rect x="254" y="68" width="20" height="92"/>
          <rect x="282" y="60" width="20" height="100"/>
          <rect x="310" y="56" width="20" height="104"/>
          <rect x="338" y="48" width="20" height="112"/>
          <rect x="366" y="52" width="20" height="108"/>
          <rect x="394" y="40" width="20" height="120"/>
          <rect x="422" y="44" width="20" height="116"/>
          <rect x="450" y="36" width="20" height="124"/>
          <rect x="478" y="48" width="20" height="112"/>
          <rect x="506" y="32" width="20" height="128"/>
          <rect x="534" y="40" width="20" height="120"/>
          <rect x="562" y="28" width="20" height="132"/>
          <rect x="590" y="36" width="20" height="124"/>
          <rect x="618" y="24" width="20" height="136"/>
          <rect x="646" y="20" width="20" height="140"/>
          <rect x="674" y="32" width="20" height="128"/>
          <rect x="702" y="28" width="20" height="132"/>
          <rect x="730" y="20" width="20" height="140"/>
          <rect x="758" y="16" width="20" height="144"/>
