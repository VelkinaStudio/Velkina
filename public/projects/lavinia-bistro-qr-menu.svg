<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Lavinia Bistro QR menu mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0E12"/>
      <stop offset="100%" stop-color="#1A1422"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="100%" stop-color="#F1E9D6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5EFDF"/>
    </linearGradient>
    <linearGradient id="phoneBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#A259FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#A259FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Decorative QR dots -->
  <g opacity="0.18" fill="#00FFFF">
    <rect x="40" y="40" width="14" height="14"/>
    <rect x="70" y="40" width="14" height="14"/>
    <rect x="40" y="70" width="14" height="14"/>
    <rect x="100" y="70" width="14" height="14"/>
    <rect x="40" y="100" width="14" height="14"/>
    <rect x="120" y="40" width="14" height="14"/>
    <rect x="100" y="100" width="14" height="14"/>
    <rect x="700" y="380" width="14" height="14"/>
    <rect x="730" y="380" width="14" height="14"/>
    <rect x="730" y="410" width="14" height="14"/>
    <rect x="700" y="440" width="14" height="14"/>
    <rect x="670" y="410" width="14" height="14"/>
  </g>

  <!-- Wordmark -->
  <text x="60" y="160" fill="#FBF7EE" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" font-weight="600">Lavinia</text>
  <text x="60" y="195" fill="#FBF7EE" opacity="0.65" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="6">B I S T R O</text>
  <text x="60" y="240" fill="#00FFFF" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="3">QR MENU — MOBILE FIRST</text>

  <!-- Tagline -->
  <text x="60" y="290" fill="#FBF7EE" opacity="0.85" font-family="Inter, Arial, sans-serif" font-size="18">Scan once. Read in 5 languages.</text>
  <text x="60" y="316" fill="#FBF7EE" opacity="0.85" font-family="Inter, Arial, sans-serif" font-size="18">Order without waiting.</text>

  <!-- Stats chips -->
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#FBF7EE">
    <rect x="60" y="360" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="119" y="382" text-anchor="middle">LCP &lt; 1.0 s</text>
    <rect x="190" y="360" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="249" y="382" text-anchor="middle">5 languages</text>
    <rect x="320" y="360" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="379" y="382" text-anchor="middle">Photos + allergens</text>
  </g>

  <!-- Phone mockup -->
  <g transform="translate(530, 35)">
    <rect x="0" y="0" width="220" height="430" rx="34" fill="url(#phoneBezel)"/>
    <rect x="6" y="6" width="208" height="418" rx="28" fill="url(#paper)"/>
    <rect x="80" y="10" width="60" height="14" rx="7" fill="#0a0a0a"/>

    <!-- Header (restaurant name) -->
    <text x="22" y="58" fill="#1B1A18" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="700">Lavinia</text>
    <text x="22" y="74" fill="#1B1A18" opacity="0.55" font-family="Inter, Arial, sans-serif" font-size="8" letter-spacing="3">B I S T R O</text>

    <!-- Language pills -->
    <g font-family="Inter, Arial, sans-serif" font-size="8" fill="#1B1A18">
      <rect x="22" y="86" width="22" height="14" rx="7" fill="#1B1A18"/>
      <text x="33" y="96" text-anchor="middle" fill="#FBF7EE">EN</text>
      <rect x="48" y="86" width="22" height="14" rx="7" fill="#ffffff" stroke="#1B1A18" stroke-opacity="0.2"/>
      <text x="59" y="96" text-anchor="middle">TR</text>
      <rect x="74" y="86" width="22" height="14" rx="7" fill="#ffffff" stroke="#1B1A18" stroke-opacity="0.2"/>
      <text x="85" y="96" text-anchor="middle">DE</text>
    </g>

    <!-- Category tabs -->
    <g font-family="Inter, Arial, sans-serif" font-size="8" fill="#1B1A18">
      <rect x="22" y="110" width="40" height="16" rx="8" fill="#1B1A18"/>
      <text x="42" y="121" text-anchor="middle" fill="#FBF7EE">Starters</text>
      <text x="74" y="121" opacity="0.6">Mains</text>
      <text x="100" y="121" opacity="0.6">Pasta</text>
      <text x="130" y="121" opacity="0.6">Desserts</text>
    </g>

    <!-- Item card 1: with photo -->
    <g transform="translate(14, 138)">
      <rect width="192" height="78" rx="10" fill="url(#card)" stroke="#1B1A18" stroke-opacity="0.08"/>
      <!-- photo -->
      <rect x="6" y="6" width="62" height="66" rx="7" fill="#7B3F00"/>
      <circle cx="37" cy="35" r="20" fill="#C77A37"/>
      <circle cx="32" cy="32" r="3" fill="#FFB76A"/>
      <circle cx="44" cy="36" r="2" fill="#FFB76A"/>
      <text x="76" y="22" font-family="Georgia, serif" font-size="11" fill="#1B1A18" font-weight="700">Burrata Salad</text>
      <text x="76" y="36" font-family="Inter, Arial, sans-serif" font-size="7" fill="#1B1A18" opacity="0.65">Heirloom tomato, basil oil</text>
      <g font-family="Inter, Arial, sans-serif" font-size="7" fill="#1B1A18">
        <rect x="76" y="44" width="22" height="11" rx="5.5" fill="#F4E5C8"/>
        <text x="87" y="52" text-anchor="middle">veg</text>
        <rect x="100" y="44" width="22" height="11" rx="5.5" fill="#F4E5C8"/>
        <text x="111" y="52" text-anchor="middle">milk</text>
      </g>
      <text x="180" y="68" font-family="Inter, Arial, sans-serif" font-size="11" fill="#1B1A18" font-weight="700" text-anchor="end">€14</text>
    </g>

    <!-- Item card 2 -->
    <g transform="translate(14, 224)">
      <rect width="192" height="78" rx="10" fill="url(#card)" stroke="#1B1A18" stroke-opacity="0.08"/>
      <rect x="6" y="6" width="62" height="66" rx="7" fill="#3A2E1F"/>
      <ellipse cx="37" cy="40" rx="22" ry="14" fill="#6B4A2B"/>
      <ellipse cx="37" cy="36" rx="18" ry="9" fill="#9E6B3F"/>
      <text x="76" y="22" font-family="Georgia, serif" font-size="11" fill="#1B1A18" font-weight="700">Truffle Risotto</text>
      <text x="76" y="36" font-family="Inter, Arial, sans-serif" font-size="7" fill="#1B1A18" opacity="0.65">Carnaroli, parmesan, sage</text>
      <g font-family="Inter, Arial, sans-serif" font-size="7" fill="#1B1A18">
        <rect x="76" y="44" width="36" height="11" rx="5.5" fill="#F4E5C8"/>
        <text x="94" y="52" text-anchor="middle">contains gluten</text>
      </g>
      <text x="180" y="68" font-family="Inter, Arial, sans-serif" font-size="11" fill="#1B1A18" font-weight="700" text-anchor="end">€22</text>
    </g>

    <!-- Item card 3 -->
    <g transform="translate(14, 310)">
      <rect width="192" height="78" rx="10" fill="url(#card)" stroke="#1B1A18" stroke-opacity="0.08"/>
      <rect x="6" y="6" width="62" height="66" rx="7" fill="#1F2D24"/>
      <ellipse cx="37" cy="42" rx="20" ry="11" fill="#55764F"/>
      <ellipse cx="30" cy="38" rx="6" ry="3" fill="#A0C49B"/>
      <ellipse cx="44" cy="40" rx="5" ry="3" fill="#A0C49B"/>
      <text x="76" y="22" font-family="Georgia, serif" font-size="11" fill="#1B1A18" font-weight="700">Lamb Chops</text>
      <text x="76" y="36" font-family="Inter, Arial, sans-serif" font-size="7" fill="#1B1A18" opacity="0.65">Rosemary jus, baby spinach</text>
      <text x="180" y="68" font-family="Inter, Arial, sans-serif" font-size="11" fill="#1B1A18" font-weight="700" text-anchor="end">€28</text>
    </g>

    <!-- Bottom action bar -->
    <g transform="translate(14, 396)">
      <rect width="192" height="22" rx="11" fill="#1B1A18"/>
      <text x="50" y="15" font-family="Inter, Arial, sans-serif" font-size="9" fill="#FBF7EE" text-anchor="middle">Call waiter</text>
      <rect x="100" y="0" width="92" height="22" rx="11" fill="#00FFFF"/>
      <text x="146" y="15" font-family="Inter, Arial, sans-serif" font-size="9" fill="#0a0a0a" font-weight="700" text-anchor="middle">Request bill</text>
    </g>
  </g>
</svg>
