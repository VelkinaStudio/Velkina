<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Bosporus Travel AI customer agent mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0E12"/>
      <stop offset="100%" stop-color="#1A1422"/>
    </linearGradient>
    <linearGradient id="wabg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5DDD5"/>
      <stop offset="100%" stop-color="#DCD4CB"/>
    </linearGradient>
    <pattern id="wapattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#000" opacity="0.04"/>
      <circle cx="30" cy="20" r="1.5" fill="#000" opacity="0.04"/>
      <circle cx="50" cy="40" r="1" fill="#000" opacity="0.04"/>
      <path d="M5,40 Q10,35 15,40" stroke="#000" stroke-opacity="0.04" fill="none"/>
    </pattern>
    <radialGradient id="glow6" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#25D366" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow6)"/>

  <!-- left side: WhatsApp phone -->
  <g transform="translate(80,80)">
    <rect width="380" height="680" rx="36" fill="#000"/>
    <rect x="8" y="8" width="364" height="664" rx="28" fill="url(#wabg)"/>
    <rect x="8" y="8" width="364" height="664" rx="28" fill="url(#wapattern)"/>
    <rect x="148" y="12" width="84" height="20" rx="10" fill="#000"/>

    <!-- WA header -->
    <g transform="translate(8,46)">
      <rect width="364" height="60" fill="#075E54"/>
      <text x="20" y="36" font-family="Inter, Arial, sans-serif" font-size="16" fill="#FFF">←</text>
      <circle cx="58" cy="30" r="18" fill="#0EA5E9"/>
      <path d="M48,40 Q58,18 68,40 Z" fill="#0369A1"/>
      <text x="58" y="35" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFF" text-anchor="middle">⛵</text>
      <text x="88" y="28" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFF" font-weight="700">Bosporus Travel</text>
      <text x="88" y="44" font-family="Inter, Arial, sans-serif" font-size="10" fill="#FFF" opacity="0.85">● online · responding instantly</text>
      <text x="300" y="36" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFF">📞</text>
      <text x="332" y="36" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFF">⋮</text>
    </g>

    <!-- date pill -->
    <g transform="translate(8,118)">
      <rect x="142" y="0" width="80" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.95"/>
      <text x="182" y="14" font-family="Inter, Arial, sans-serif" font-size="9" fill="#3a3a3a" text-anchor="middle" font-weight="600">TODAY</text>
    </g>

    <!-- guest message 1 -->
    <g transform="translate(20,138)">
      <rect width="240" height="50" rx="8" fill="#FFFFFF"/>
      <polygon points="0,4 -8,4 0,12" fill="#FFFFFF"/>
      <text x="12" y="20" font-family="Inter, Arial, sans-serif" font-size="11" fill="#1F1A28">Hi! Is the Bosphorus dinner</text>
      <text x="12" y="36" font-family="Inter, Arial, sans-serif" font-size="11" fill="#1F1A28">cruise available tomorrow at 8?</text>
      <text x="232" y="44" font-family="Inter, Arial, sans-serif" font-size="9" fill="#5C6B85" text-anchor="end">02:14 ✓</text>
    </g>

    <!-- agent reply 1 -->
    <g transform="translate(108,200)">
      <rect width="248" height="76" rx="8" fill="#DCF8C6"/>
      <polygon points="248,4 256,4 248,12" fill="#DCF8C6"/>
      <text x="12" y="20" font-family="Inter, Arial, sans-serif" font-size="11" fill="#1F1A28">Yes! 🎉 The 8 PM Bosphorus dinner</text>
      <text x="12" y="36" font-family="Inter, Arial, sans-serif" font-size="11" fill="#1F1A28">cruise has 14 seats free tomorrow.</text>
      <text x="12" y="52" font-family="Inter, Arial, sans-serif" font-size="11" fill="#1F1A28">€85 pp · live music · 3-course menu</text>
      <text x="12" y="68" font-family="Inter, Arial, sans-serif" font-size="11" fill="#1F1A28">+ free hotel pickup.</text>
      <text x="234" y="68" font-family="Inter, Arial, sans-serif" font-size="9" fill="#3A6E9B" text-anchor="end">02:14 ✓✓</text>
    </g>

    <!-- guest message 2 -->
    <g transform="translate(20,288)">
      <rect width="200" height="34" rx="8" fill="#FFFFFF"/>
      <polygon points="0,4 -8,4 0,12" fill="#FFFFFF"/>
      <text x="12" y="22" font-family="Inter, Arial, sans-serif" font-size="11" fill="#1F1A28">Great. We are 4 people.</text>
      <text x="192" y="28" font-family="Inter, Arial, sans-serif" font-size="9" fill="#5C6B85" text-anchor="end">02:14 ✓</text>
    </g>

    <!-- agent reply 2 with quick book buttons -->
    <g transform="translate(48,334)">
      <rect width="308" height="124" rx="8" fill="#DCF8C6"/>
      <polygon points="308,4 316,4 308,12" fill="#DCF8C6"/>
      <text x="12" y="20" font-family="Inter, Arial, sans-serif" font-size="11" fill="#1F1A28">Booked you a table for 4 at the</text>
      <text x="12" y="36" font-family="Inter, Arial, sans-serif" font-size="11" fill="#1F1A28">8 PM cruise. Total: €340</text>
      <text x="12" y="52" font-family="Inter, Arial, sans-serif" font-size="11" fill="#1F1A28">Pickup: 6:45 PM from your hotel.</text>
      <rect x="12" y="62" width="284" height="28" rx="14" fill="#FFF" stroke="#22C55E"/>
      <text x="154" y="80" font-family="Inter, Arial, sans-serif" font-size="11" fill="#22C55E" text-anchor="middle" font-weight="700">CONFIRM &amp; PAY · €340</text>
      <rect x="12" y="94" width="138" height="22" rx="11" fill="#FFF" stroke="#3A6E9B" stroke-opacity="0.3"/>
      <text x="81" y="109" font-family="Inter, Arial, sans-serif" font-size="10" fill="#3A6E9B" text-anchor="middle">Change time</text>
      <rect x="156" y="94" width="138" height="22" rx="11" fill="#FFF" stroke="#3A6E9B" stroke-opacity="0.3"/>
      <text x="225" y="109" font-family="Inter, Arial, sans-serif" font-size="10" fill="#3A6E9B" text-anchor="middle">Talk to a human</text>
      <text x="294" y="116" font-family="Inter, Arial, sans-serif" font-size="9" fill="#3A6E9B" text-anchor="end">02:15 ✓✓</text>
    </g>

    <!-- typing indicator -->
    <g transform="translate(20,478)">
      <rect width="60" height="28" rx="8" fill="#FFFFFF"/>
      <circle cx="20" cy="14" r="3" fill="#5C6B85"/>
      <circle cx="30" cy="14" r="3" fill="#5C6B85" opacity="0.6"/>
      <circle cx="40" cy="14" r="3" fill="#5C6B85" opacity="0.3"/>
    </g>

    <!-- WA input -->
    <g transform="translate(8,640)">
      <rect width="364" height="42" fill="#F0F0F0"/>
      <rect x="14" y="6" width="290" height="30" rx="15" fill="#FFF"/>
      <text x="28" y="26" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5C6B85">Message</text>
      <text x="280" y="26" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5C6B85">📎</text>
      <circle cx="330" cy="21" r="14" fill="#075E54"/>
      <text x="330" y="26" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFF" text-anchor="middle">➤</text>
    </g>
  </g>

  <!-- right side: agent dashboard -->
  <g transform="translate(500,80)" font-family="Inter, Arial, sans-serif">
    <rect width="620" height="680" rx="14" fill="#FFF" stroke="#000" stroke-opacity="0.15"/>
    <rect width="620" height="44" rx="14" fill="#0F1A2F"/>
    <rect y="20" width="620" height="24" fill="#0F1A2F"/>
    <text x="20" y="28" font-size="12" fill="#FFF" font-weight="700">Velkina · AI Agent Console</text>
    <text x="240" y="28" font-size="11" fill="#FFF" opacity="0.7">Bosporus Travel · Production</text>
    <text x="600" y="28" font-size="11" fill="#22C55E" text-anchor="end">● LIVE</text>

    <!-- agent stats -->
    <g transform="translate(20,64)">
      <text x="0" y="0" font-size="11" letter-spacing="2" fill="#5C6B85">LAST 24 HOURS</text>
      <g transform="translate(0,12)">
        <rect width="180" height="80" rx="6" fill="#F4F6F8"/>
        <text x="16" y="28" font-size="11" fill="#5C6B85" letter-spacing="2">CONVERSATIONS</text>
        <text x="16" y="58" font-size="26" font-weight="800" fill="#0F1A2F">428</text>
        <text x="110" y="58" font-size="11" fill="#22C55E">↑ 24%</text>
      </g>
      <g transform="translate(196,12)">
        <rect width="180" height="80" rx="6" fill="#F4F6F8"/>
        <text x="16" y="28" font-size="11" fill="#5C6B85" letter-spacing="2">AUTO-HANDLED</text>
        <text x="16" y="58" font-size="26" font-weight="800" fill="#22C55E">81%</text>
        <text x="100" y="58" font-size="11" fill="#5C6B85">no human needed</text>
      </g>
      <g transform="translate(392,12)">
        <rect width="188" height="80" rx="6" fill="#F4F6F8"/>
        <text x="16" y="28" font-size="11" fill="#5C6B85" letter-spacing="2">AVG. RESPONSE</text>
        <text x="16" y="58" font-size="26" font-weight="800" fill="#0F1A2F">32 s</text>
        <text x="100" y="58" font-size="11" fill="#22C55E">was 4h before</text>
      </g>
    </g>

    <!-- agent config card -->
    <g transform="translate(20,170)">
      <rect width="580" height="220" rx="6" fill="#F4F6F8" stroke="#E5E7EB"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#0F1A2F">Agent · "Captain"</text>
      <text x="120" y="24" font-size="11" fill="#5C6B85">GPT-4o · Velkina prompt v4.2 · 4 languages</text>
      <text x="560" y="24" font-size="11" fill="#22C55E" text-anchor="end">● Healthy</text>

      <g transform="translate(16,40)" font-size="11" fill="#0F1A2F">
        <text font-weight="700" letter-spacing="2" fill="#5C6B85">SYSTEM PROMPT (excerpt)</text>
        <rect y="8" width="548" height="120" rx="4" fill="#FFF" stroke="#E5E7EB"/>
        <g transform="translate(12,24)" font-family="JetBrains Mono, monospace" font-size="10" fill="#0F1A2F">
          <text>You are Captain, the AI agent for Bosporus Travel. You help</text>
          <text y="14">tourists book tours, answer FAQs, and escalate to a human</text>
          <text y="28">when the question is complex or the customer asks for one.</text>
          <text y="42">Tools: search_tours(), check_availability(date, party_size),</text>
          <text y="56">book(tour_id, guest_info, payment_link), escalate(reason).</text>
          <text y="70">Languages: English, Turkish, German, Arabic. Voice: warm,</text>
          <text y="84">concise, never pushy. Always confirm price + pickup before booking.</text>
          <text y="100" fill="#5C6B85">// 28 example dialogues attached as few-shot grounding</text>
        </g>
      </g>
    </g>

    <!-- live conversations list -->
    <g transform="translate(20,408)">
      <text font-size="11" letter-spacing="2" fill="#5C6B85">LIVE NOW · 7 ACTIVE</text>
      <g transform="translate(0,12)">
        <rect width="580" height="36" rx="4" fill="#FFF" stroke="#E5E7EB"/>
        <circle cx="20" cy="18" r="10" fill="#22C55E"/>
        <text x="20" y="22" font-size="10" fill="#FFF" text-anchor="middle" font-weight="800">M</text>
        <text x="40" y="22" font-size="12" font-weight="600" fill="#0F1A2F">Maria · DE</text>
        <text x="120" y="22" font-size="11" fill="#5C6B85">Asking about Cappadocia 3-day tour…</text>
        <text x="560" y="22" font-size="10" fill="#22C55E" text-anchor="end" font-weight="700">AUTO · 2 messages</text>
      </g>
      <g transform="translate(0,52)">
        <rect width="580" height="36" rx="4" fill="#FFF" stroke="#E5E7EB"/>
        <circle cx="20" cy="18" r="10" fill="#A259FF"/>
        <text x="20" y="22" font-size="10" fill="#FFF" text-anchor="middle" font-weight="800">Y</text>
        <text x="40" y="22" font-size="12" font-weight="600" fill="#0F1A2F">Yara · AR</text>
        <text x="120" y="22" font-size="11" fill="#5C6B85">Group of 12 — agent escalating to Hakan</text>
        <text x="560" y="22" font-size="10" fill="#F59E0B" text-anchor="end" font-weight="700">ESCALATED</text>
      </g>
      <g transform="translate(0,92)">
        <rect width="580" height="36" rx="4" fill="#FFF" stroke="#E5E7EB"/>
        <circle cx="20" cy="18" r="10" fill="#0EA5E9"/>
        <text x="20" y="22" font-size="10" fill="#FFF" text-anchor="middle" font-weight="800">J</text>
        <text x="40" y="22" font-size="12" font-weight="600" fill="#0F1A2F">John · EN</text>
        <text x="120" y="22" font-size="11" fill="#5C6B85">Booked: Bosphorus dinner · 4 guests · €340</text>
        <text x="560" y="22" font-size="10" fill="#22C55E" text-anchor="end" font-weight="700">CONFIRMED</text>
      </g>
      <g transform="translate(0,132)">
        <rect width="580" height="36" rx="4" fill="#FFF" stroke="#E5E7EB"/>
        <circle cx="20" cy="18" r="10" fill="#FB7185"/>
        <text x="20" y="22" font-size="10" fill="#FFF" text-anchor="middle" font-weight="800">A</text>
        <text x="40" y="22" font-size="12" font-weight="600" fill="#0F1A2F">Ahmet · TR</text>
        <text x="120" y="22" font-size="11" fill="#5C6B85">Cancellation — agent processed refund</text>
        <text x="560" y="22" font-size="10" fill="#22C55E" text-anchor="end" font-weight="700">AUTO</text>
      </g>
    </g>
  </g>

  <g transform="translate(20,750)" font-family="Inter, Arial, sans-serif" fill="#FAF7F2">
    <text font-size="11" letter-spacing="3" opacity="0.6">AI · WHATSAPP · TRAINED ON YOUR BUSINESS · 4 LANGUAGES</text>
  </g>
</svg>
