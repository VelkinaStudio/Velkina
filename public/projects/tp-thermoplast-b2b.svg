<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="TP Thermoplast B2B website mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0E12"/>
      <stop offset="100%" stop-color="#1A1422"/>
    </linearGradient>
    <linearGradient id="industrial" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F3A56"/>
      <stop offset="100%" stop-color="#0F1F33"/>
    </linearGradient>
    <linearGradient id="pellet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7AB8E8"/>
      <stop offset="100%" stop-color="#3A6E9B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00FFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <g transform="translate(60,60)">
    <rect width="1080" height="680" rx="14" fill="#FFFFFF" stroke="#000" stroke-opacity="0.15"/>
    <rect width="1080" height="38" rx="14" fill="#F4F6F8"/>
    <rect y="20" width="1080" height="18" fill="#F4F6F8"/>
    <circle cx="20" cy="19" r="6" fill="#FF5F57"/>
    <circle cx="40" cy="19" r="6" fill="#FEBC2E"/>
    <circle cx="60" cy="19" r="6" fill="#28C840"/>
    <rect x="86" y="9" width="400" height="20" rx="10" fill="#FFF" stroke="#000" stroke-opacity="0.08"/>
    <text x="100" y="23" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3a3a3a">🔒 tpthermoplast.com/products/abs-pellets</text>

    <!-- nav -->
    <g transform="translate(0,38)">
      <rect width="1080" height="52" fill="#FFFFFF"/>
      <g transform="translate(40,16)">
        <rect width="36" height="22" rx="3" fill="#0F1F33"/>
        <text x="18" y="16" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFF" font-weight="800" text-anchor="middle">TP</text>
        <text x="46" y="17" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F1F33">Thermoplast</text>
      </g>
      <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#0F1F33">
        <text x="400" y="32">Products</text>
        <text x="475" y="32">Industries</text>
        <text x="558" y="32">Specifications</text>
        <text x="660" y="32">About</text>
        <text x="710" y="32">Contact</text>
      </g>
      <g transform="translate(820,12)">
        <rect width="42" height="26" rx="3" fill="#FFF" stroke="#0F1F33" stroke-opacity="0.2"/>
        <text x="21" y="18" font-size="11" text-anchor="middle">TR</text>
        <rect x="48" width="42" height="26" rx="3" fill="#0F1F33"/>
        <text x="69" y="18" font-size="11" fill="#FFF" text-anchor="middle">EN</text>
        <rect x="96" width="42" height="26" rx="3" fill="#FFF" stroke="#0F1F33" stroke-opacity="0.2"/>
        <text x="117" y="18" font-size="11" text-anchor="middle">DE</text>
      </g>
      <rect x="980" y="12" width="60" height="26" rx="3" fill="#E54F1B"/>
      <text x="1010" y="29" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFF" font-weight="700" text-anchor="middle">Quote</text>
      <line x1="0" y1="52" x2="1080" y2="52" stroke="#000" stroke-opacity="0.08"/>
    </g>

    <!-- breadcrumb -->
    <g transform="translate(40,108)" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5A6A7C">
      <text>Products  /  Engineering plastics  /  ABS pellets  /  TP-ABS-201</text>
    </g>

    <!-- main: hero + spec -->
    <g transform="translate(40,140)">
      <!-- product visual -->
      <rect width="460" height="380" rx="6" fill="url(#industrial)"/>
      <!-- pellet pile -->
      <g transform="translate(60,150)">
        <ellipse cx="170" cy="190" rx="170" ry="40" fill="#000" fill-opacity="0.35"/>
        <g fill="url(#pellet)">
          <ellipse cx="60" cy="140" rx="10" ry="14"/>
          <ellipse cx="90" cy="158" rx="10" ry="14"/>
          <ellipse cx="120" cy="140" rx="10" ry="14"/>
          <ellipse cx="150" cy="160" rx="10" ry="14"/>
          <ellipse cx="180" cy="140" rx="10" ry="14"/>
          <ellipse cx="210" cy="160" rx="10" ry="14"/>
          <ellipse cx="240" cy="140" rx="10" ry="14"/>
          <ellipse cx="270" cy="160" rx="10" ry="14"/>
          <ellipse cx="75" cy="170" rx="10" ry="14"/>
          <ellipse cx="105" cy="188" rx="10" ry="14"/>
          <ellipse cx="135" cy="170" rx="10" ry="14"/>
          <ellipse cx="165" cy="188" rx="10" ry="14"/>
          <ellipse cx="195" cy="170" rx="10" ry="14"/>
          <ellipse cx="225" cy="188" rx="10" ry="14"/>
          <ellipse cx="255" cy="170" rx="10" ry="14"/>
          <ellipse cx="90" cy="200" rx="10" ry="14"/>
          <ellipse cx="120" cy="200" rx="10" ry="14"/>
          <ellipse cx="150" cy="200" rx="10" ry="14"/>
          <ellipse cx="180" cy="200" rx="10" ry="14"/>
          <ellipse cx="210" cy="200" rx="10" ry="14"/>
          <ellipse cx="240" cy="200" rx="10" ry="14"/>
        </g>
      </g>
      <text x="30" y="40" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#7AB8E8" opacity="0.8">SKU · TP-ABS-201 · IN STOCK</text>

      <!-- right info -->
      <g transform="translate(490,0)" font-family="Inter, Arial, sans-serif" fill="#0F1F33">
        <text x="0" y="20" font-size="11" letter-spacing="3" fill="#5A6A7C">ENGINEERING PLASTICS</text>
        <text x="0" y="58" font-size="30" font-weight="700">ABS Natural — Injection Grade</text>
        <text x="0" y="80" font-size="13" fill="#5A6A7C">Acrylonitrile Butadiene Styrene · Melt Flow 16 g/10min · Granule</text>

        <!-- spec table -->
        <g transform="translate(0,110)">
          <rect width="500" height="200" rx="4" fill="#F4F6F8" stroke="#0F1F33" stroke-opacity="0.1"/>
          <text x="20" y="28" font-size="13" font-weight="700">Technical specification</text>
          <g font-size="12">
            <line x1="20" y1="40" x2="480" y2="40" stroke="#0F1F33" stroke-opacity="0.08"/>
            <text x="20" y="62" fill="#5A6A7C">Density</text>
            <text x="240" y="62" font-weight="600">1.04 g/cm³</text>
            <line x1="20" y1="76" x2="480" y2="76" stroke="#0F1F33" stroke-opacity="0.08"/>
            <text x="20" y="98" fill="#5A6A7C">Melt flow rate (220°C, 10kg)</text>
            <text x="240" y="98" font-weight="600">16 g / 10 min</text>
            <line x1="20" y1="112" x2="480" y2="112" stroke="#0F1F33" stroke-opacity="0.08"/>
            <text x="20" y="134" fill="#5A6A7C">Tensile strength</text>
            <text x="240" y="134" font-weight="600">42 MPa (ISO 527)</text>
            <line x1="20" y1="148" x2="480" y2="148" stroke="#0F1F33" stroke-opacity="0.08"/>
            <text x="20" y="170" fill="#5A6A7C">Heat-deflection temp</text>
            <text x="240" y="170" font-weight="600">95 °C (1.8 MPa)</text>
          </g>
        </g>

        <!-- actions -->
        <g transform="translate(0,330)">
          <rect width="240" height="44" rx="3" fill="#E54F1B"/>
          <text x="120" y="29" font-size="13" fill="#FFF" text-anchor="middle" font-weight="700" letter-spacing="2">REQUEST A QUOTE</text>
          <rect x="252" width="240" height="44" rx="3" fill="#FFF" stroke="#0F1F33" stroke-width="1.5"/>
          <text x="372" y="29" font-size="13" text-anchor="middle" font-weight="700" letter-spacing="2">DOWNLOAD TDS (PDF)</text>
        </g>
      </g>
    </g>

    <!-- featured industries -->
    <g transform="translate(40,540)">
      <text font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#5A6A7C">USED IN INDUSTRIES</text>
      <g transform="translate(0,16)" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0F1F33">
        <rect width="180" height="80" rx="4" fill="#F4F6F8"/>
        <text x="20" y="28" font-weight="700">Automotive</text>
        <text x="20" y="48" font-size="11" fill="#5A6A7C">Interior trims, housings, knobs</text>
        <text x="20" y="64" font-size="11" fill="#5A6A7C">240+ tonnes / month</text>

        <rect x="200" width="180" height="80" rx="4" fill="#F4F6F8"/>
        <text x="220" y="28" font-weight="700">Appliances</text>
        <text x="220" y="48" font-size="11" fill="#5A6A7C">Kitchen & laundry parts</text>
        <text x="220" y="64" font-size="11" fill="#5A6A7C">95+ tonnes / month</text>

        <rect x="400" width="180" height="80" rx="4" fill="#F4F6F8"/>
        <text x="420" y="28" font-weight="700">Electronics</text>
        <text x="420" y="48" font-size="11" fill="#5A6A7C">Housings, connectors</text>
        <text x="420" y="64" font-size="11" fill="#5A6A7C">60+ tonnes / month</text>

        <rect x="600" width="180" height="80" rx="4" fill="#F4F6F8"/>
        <text x="620" y="28" font-weight="700">Toys & sports</text>
        <text x="620" y="48" font-size="11" fill="#5A6A7C">Durable safe materials</text>
        <text x="620" y="64" font-size="11" fill="#5A6A7C">45+ tonnes / month</text>

        <rect x="800" width="180" height="80" rx="4" fill="#F4F6F8"/>
        <text x="820" y="28" font-weight="700">Industrial</text>
        <text x="820" y="48" font-size="11" fill="#5A6A7C">Tooling, jigs, fixtures</text>
        <text x="820" y="64" font-size="11" fill="#5A6A7C">Custom orders</text>
      </g>
    </g>
  </g>

  <g transform="translate(20,750)" font-family="Inter, Arial, sans-serif" fill="#FAF7F2">
    <text font-size="11" letter-spacing="3" opacity="0.6">B2B · MULTILINGUAL · CATALOG · LEAD CAPTURE</text>
  </g>
</svg>
