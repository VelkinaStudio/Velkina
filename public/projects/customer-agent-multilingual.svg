<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Customer-Agent multilingual AI customer service mockup">
  <defs>
    <linearGradient id="ca-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0E0B"/>
      <stop offset="100%" stop-color="#1B1610"/>
    </linearGradient>
    <radialGradient id="ca-glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#E8B05E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#E8B05E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#ca-bg)"/>
  <rect width="1200" height="800" fill="url(#ca-glow)"/>

  <!-- App window -->
  <g transform="translate(60,60)">
    <rect width="1080" height="680" rx="14" fill="#FAF7F0" stroke="#000" stroke-opacity="0.18"/>
    <rect width="1080" height="40" rx="14" fill="#E7E1D3"/>
    <rect y="22" width="1080" height="18" fill="#E7E1D3"/>
    <circle cx="22" cy="20" r="6" fill="#FF5F57"/>
    <circle cx="42" cy="20" r="6" fill="#FEBC2E"/>
    <circle cx="62" cy="20" r="6" fill="#28C840"/>
    <rect x="92" y="10" width="540" height="20" rx="10" fill="#FFF" stroke="#000" stroke-opacity="0.08"/>
    <text x="106" y="24" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3a3a3a">app.velkina.com / customer-agent / inbox</text>

    <!-- 3 panel layout: convo list / chat / agent inspector -->
    <g transform="translate(0,40)">
      <!-- Left: conversation list -->
      <rect width="280" height="640" fill="#FAF7F0" stroke="#E7E1D3"/>
      <text x="22" y="32" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#0B0A07" letter-spacing="-0.02em">Inbox</text>
      <text x="76" y="32" font-family="Inter, Arial, sans-serif" font-size="11" fill="#7A7466">· 47 open</text>
      <rect x="22" y="48" width="236" height="28" rx="14" fill="#FFFEF8" stroke="#D6D1C2"/>
      <text x="36" y="66" font-family="Inter, Arial, sans-serif" font-size="11" fill="#7A7466">⌕  Search conversations</text>

      <g transform="translate(0,90)" font-family="Inter, Arial, sans-serif">
        <!-- Active convo -->
        <rect x="14" y="0" width="252" height="68" rx="8" fill="#FFEFD8" stroke="#E8B05E"/>
        <g transform="translate(28,16)">
          <circle r="14" fill="#0B0A07"/>
          <text y="4" font-size="10" font-weight="700" fill="#FAF8F2" text-anchor="middle">A</text>
        </g>
        <text x="56" y="22" font-size="12" font-weight="700" fill="#0B0A07">Anca · RO</text>
        <text x="232" y="22" font-size="9" fill="#7A7466" text-anchor="end">2m</text>
        <text x="56" y="38" font-size="11" fill="#3A3A3A">Buna ziua, am o intrebare despre comanda…</text>
        <rect x="56" y="44" width="44" height="14" rx="7" fill="#0B0A07"/>
        <text x="78" y="54" font-size="8" fill="#FAF8F2" text-anchor="middle" font-weight="700">REFUND</text>

        <!-- 4 more -->
        <g transform="translate(0,80)">
          <g transform="translate(28,16)"><circle r="14" fill="#1F1B33"/><text y="4" font-size="10" font-weight="700" fill="#FAF8F2" text-anchor="middle">D</text></g>
          <text x="56" y="22" font-size="12" font-weight="600" fill="#0B0A07">Dilek · TR</text>
          <text x="232" y="22" font-size="9" fill="#7A7466" text-anchor="end">11m</text>
          <text x="56" y="38" font-size="11" fill="#5A574C">Merhaba, ürün ne zaman gelir?</text>
          <rect x="56" y="44" width="40" height="14" rx="7" fill="#16A34A"/>
          <text x="76" y="54" font-size="8" fill="#FFF" text-anchor="middle" font-weight="700">SHIP</text>
        </g>
        <g transform="translate(0,158)">
          <g transform="translate(28,16)"><circle r="14" fill="#0F2C2A"/><text y="4" font-size="10" font-weight="700" fill="#FAF8F2" text-anchor="middle">M</text></g>
          <text x="56" y="22" font-size="12" font-weight="600" fill="#0B0A07">Michael · EN</text>
          <text x="232" y="22" font-size="9" fill="#7A7466" text-anchor="end">34m</text>
          <text x="56" y="38" font-size="11" fill="#5A574C">Can I get an invoice for last month?</text>
          <rect x="56" y="44" width="44" height="14" rx="7" fill="#C97B4F"/>
          <text x="78" y="54" font-size="8" fill="#FFF" text-anchor="middle" font-weight="700">BILLING</text>
        </g>
        <g transform="translate(0,236)">
          <g transform="translate(28,16)"><circle r="14" fill="#3A1A14"/><text y="4" font-size="10" font-weight="700" fill="#FAF8F2" text-anchor="middle">H</text></g>
          <text x="56" y="22" font-size="12" font-weight="600" fill="#0B0A07">Hans · DE</text>
          <text x="232" y="22" font-size="9" fill="#7A7466" text-anchor="end">1h</text>
          <text x="56" y="38" font-size="11" fill="#5A574C">Wo finde ich den Größenführer?</text>
          <rect x="56" y="44" width="36" height="14" rx="7" fill="#8FB8D0"/>
          <text x="74" y="54" font-size="8" fill="#FFF" text-anchor="middle" font-weight="700">FAQ</text>
        </g>
        <g transform="translate(0,314)">
          <g transform="translate(28,16)"><circle r="14" fill="#2A1F12"/><text y="4" font-size="10" font-weight="700" fill="#FAF8F2" text-anchor="middle">C</text></g>
          <text x="56" y="22" font-size="12" font-weight="600" fill="#0B0A07">Carmen · ES</text>
          <text x="232" y="22" font-size="9" fill="#7A7466" text-anchor="end">2h</text>
          <text x="56" y="38" font-size="11" fill="#5A574C">¿Hacéis envíos a Madrid?</text>
          <rect x="56" y="44" width="44" height="14" rx="7" fill="#16A34A"/>
          <text x="78" y="54" font-size="8" fill="#FFF" text-anchor="middle" font-weight="700">SHIP</text>
        </g>
      </g>

      <!-- Center: chat -->
      <g transform="translate(280,0)">
        <rect width="500" height="640" fill="#FFFEF8" stroke="#E7E1D3"/>

        <!-- header -->
        <g>
          <rect width="500" height="56" fill="#FFFEF8" stroke="#E7E1D3"/>
          <g transform="translate(20,28)">
            <circle r="14" fill="#0B0A07"/>
            <text y="4" font-size="10" font-weight="700" fill="#FAF8F2" text-anchor="middle">A</text>
          </g>
          <text x="46" y="26" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0A07">Anca Petrescu</text>
          <text x="46" y="42" font-family="Inter, Arial, sans-serif" font-size="10" fill="#7A7466">Romanian · Bucharest · Order #5482</text>
          <rect x="380" y="18" width="100" height="22" rx="11" fill="#0B0A07"/>
          <text x="430" y="33" font-family="Inter, Arial, sans-serif" font-size="10" fill="#FAF8F2" text-anchor="middle" font-weight="700">Agent: AUTO</text>
        </g>

        <!-- chat thread -->
        <g transform="translate(0,68)" font-family="Inter, Arial, sans-serif">
          <!-- customer msg -->
          <g transform="translate(20,12)">
            <rect width="320" height="60" rx="12" fill="#F4F1E8"/>
            <text x="16" y="22" font-size="11" fill="#0B0A07">Bună ziua, am primit comanda dar produsul</text>
            <text x="16" y="36" font-size="11" fill="#0B0A07">nu se potrivește. Cum returnez? Comanda</text>
            <text x="16" y="50" font-size="11" fill="#0B0A07">a fost plătită cu card.</text>
            <text x="16" y="76" font-size="9" fill="#7A7466">RO · 14:08 · received</text>
          </g>

          <!-- agent reply -->
          <g transform="translate(160,108)">
            <rect width="320" height="78" rx="12" fill="#0B0A07"/>
            <text x="16" y="22" font-size="11" fill="#FAF8F2">Bună, Anca. Îmi pare rău. Pentru retur,</text>
            <text x="16" y="36" font-size="11" fill="#FAF8F2">deschide acest link şi alege „rambursare</text>
            <text x="16" y="50" font-size="11" fill="#FAF8F2">card": <tspan fill="#E8B05E" text-decoration="underline">velkina.com/r/5482</tspan></text>
            <text x="16" y="64" font-size="11" fill="#FAF8F2">Banii revin în 5–7 zile lucrătoare.</text>
            <text x="16" y="94" font-size="9" fill="#9CA3AF">AGENT · model claude-opus-4-7 · 14:08:04 · 1.8s</text>
          </g>

          <!-- customer follow-up -->
          <g transform="translate(20,222)">
            <rect width="240" height="40" rx="12" fill="#F4F1E8"/>
            <text x="16" y="22" font-size="11" fill="#0B0A07">Mulțumesc. Și costul de retur?</text>
            <text x="16" y="56" font-size="9" fill="#7A7466">RO · 14:09</text>
          </g>

          <!-- agent draft (with handoff banner) -->
          <g transform="translate(160,294)">
            <rect width="320" height="78" rx="12" fill="#FFFEF8" stroke="#E8B05E" stroke-dasharray="3,3"/>
            <text x="16" y="22" font-size="11" fill="#0B0A07">Pentru returul gratuit din România, atașăm</text>
            <text x="16" y="36" font-size="11" fill="#0B0A07">o etichetă DPD în PDF. Doar imprim-o şi</text>
            <text x="16" y="50" font-size="11" fill="#0B0A07">depune coletul la cel mai apropiat punct.</text>
            <text x="16" y="64" font-size="11" fill="#0B0A07" font-style="italic">…draft suggested, awaiting Nalba approval</text>
            <rect x="0" y="-20" width="120" height="16" rx="8" fill="#E8B05E"/>
            <text x="60" y="-9" font-size="9" fill="#0B0A07" text-anchor="middle" font-weight="700">REVIEW BEFORE SEND</text>
          </g>
        </g>

        <!-- composer -->
        <g transform="translate(20,576)">
          <rect width="460" height="44" rx="22" fill="#F4F1E8" stroke="#D6D1C2"/>
          <text x="22" y="28" font-family="Inter, Arial, sans-serif" font-size="11" fill="#7A7466">Type a reply… (suggestion above)</text>
          <rect x="380" y="6" width="74" height="32" rx="16" fill="#0B0A07"/>
          <text x="417" y="26" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FAF8F2" text-anchor="middle" font-weight="700">Send</text>
        </g>
      </g>

      <!-- Right: agent inspector -->
      <g transform="translate(780,0)">
        <rect width="300" height="640" fill="#FAF7F0" stroke="#E7E1D3"/>
        <text x="22" y="32" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#0B0A07" letter-spacing="-0.02em">Agent inspector</text>

        <g transform="translate(22,52)" font-family="Inter, Arial, sans-serif">
          <text font-size="10" letter-spacing="2" fill="#7A7466">DETECTED LANGUAGE</text>
          <text y="22" font-size="14" font-weight="800" fill="#0B0A07">Romanian (RO)</text>
          <text y="38" font-size="10" fill="#7A7466">confidence 0.98 · langid-fasttext</text>

          <text y="76" font-size="10" letter-spacing="2" fill="#7A7466">INTENT</text>
          <text y="98" font-size="14" font-weight="800" fill="#0B0A07">refund.request</text>
          <text y="114" font-size="10" fill="#7A7466">90.2% match · 12 examples in playbook</text>

          <text y="152" font-size="10" letter-spacing="2" fill="#7A7466">ORDER LOOKUP</text>
          <g transform="translate(0,160)">
            <rect width="256" height="60" rx="6" fill="#FFFEF8" stroke="#E7E1D3"/>
            <text x="14" y="22" font-size="11" font-weight="700" fill="#0B0A07">#5482 · Rain Group</text>
            <text x="14" y="38" font-size="10" fill="#5A574C">Trail Boot 41 · €148.00 · delivered</text>
            <text x="14" y="52" font-size="10" fill="#5A574C">Paid by card · refundable 30d</text>
          </g>

          <text y="246" font-size="10" letter-spacing="2" fill="#7A7466">PLAYBOOK MATCHED</text>
          <g transform="translate(0,254)">
            <rect width="256" height="40" rx="6" fill="#FFEFD8"/>
            <text x="14" y="22" font-size="11" font-weight="700" fill="#0B0A07">RG · returns · RO</text>
            <text x="14" y="34" font-size="9" fill="#5A574C">DPD label · 5-7d refund window</text>
          </g>

          <text y="324" font-size="10" letter-spacing="2" fill="#7A7466">HANDOFF RULE</text>
          <g transform="translate(0,332)">
            <rect width="256" height="34" rx="6" fill="#FFFEF8" stroke="#E7E1D3"/>
            <text x="14" y="22" font-size="11" fill="#0B0A07">▸ refund &gt; €100 → human review</text>
          </g>

          <rect x="0" y="394" width="256" height="32" rx="16" fill="#E8B05E"/>
          <text x="128" y="414" font-size="11" font-weight="700" fill="#0B0A07" text-anchor="middle">Approve &amp; send →</text>
        </g>
      </g>
    </g>
  </g>

  <g font-family="JetBrains Mono, monospace" fill="#9A958B" opacity="0.5">
    <text x="60" y="770" font-size="10" letter-spacing="2">CUSTOMER-AGENT · MULTILINGUAL · EN/TR/RO/DE/ES</text>
    <text x="1140" y="770" font-size="10" letter-spacing="2" text-anchor="end">CLAUDE OPUS · POSTGRES · WHATSAPP + EMAIL + WEB</text>
  </g>
</svg>
