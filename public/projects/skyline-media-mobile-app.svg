<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Skyline Media mobile app mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0E12"/>
      <stop offset="100%" stop-color="#1A1422"/>
    </linearGradient>
    <linearGradient id="phoneSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB28A"/>
      <stop offset="50%" stop-color="#E97777"/>
      <stop offset="100%" stop-color="#0F1A2F"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4FA3"/>
      <stop offset="100%" stop-color="#A259FF"/>
    </linearGradient>
    <radialGradient id="glow7" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#A259FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A259FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow7)"/>

  <!-- left phone: home feed -->
  <g transform="translate(140,90)">
    <rect width="320" height="640" rx="40" fill="#000"/>
    <rect x="8" y="8" width="304" height="624" rx="32" fill="#0A0A12"/>
    <rect x="120" y="14" width="80" height="20" rx="10" fill="#000"/>

    <!-- status bar -->
    <g transform="translate(8,52)">
      <text x="20" y="14" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFF" font-weight="700">9:41</text>
      <text x="266" y="14" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFF">●●●●</text>
    </g>

    <!-- App header -->
    <g transform="translate(8,76)">
      <text x="20" y="22" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFF" letter-spacing="2">SKYLINE</text>
      <text x="160" y="22" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFF" opacity="0.85">🔔</text>
      <text x="190" y="22" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFF" opacity="0.85">🔍</text>
      <circle cx="280" cy="18" r="14" fill="url(#brand)"/>
      <text x="280" y="22" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle" font-weight="700">M</text>
    </g>

    <!-- category chips -->
    <g transform="translate(8,108)" font-family="Inter, Arial, sans-serif" font-size="10" fill="#FFF">
      <rect x="20" width="56" height="26" rx="13" fill="#FF4FA3"/>
      <text x="48" y="17" text-anchor="middle" font-weight="700">FOR YOU</text>
      <rect x="80" width="50" height="26" rx="13" fill="#FFF" fill-opacity="0.1"/>
      <text x="105" y="17" text-anchor="middle">Tech</text>
      <rect x="134" width="68" height="26" rx="13" fill="#FFF" fill-opacity="0.1"/>
      <text x="168" y="17" text-anchor="middle">Business</text>
      <rect x="206" width="64" height="26" rx="13" fill="#FFF" fill-opacity="0.1"/>
      <text x="238" y="17" text-anchor="middle">Culture</text>
    </g>

    <!-- featured card -->
    <g transform="translate(28,148)">
      <rect width="264" height="186" rx="14" fill="url(#phoneSky)"/>
      <text x="16" y="22" font-family="Inter, Arial, sans-serif" font-size="9" letter-spacing="3" fill="#FFF" opacity="0.85">FEATURED · TECH</text>
      <text x="16" y="120" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFF">The next decade of</text>
      <text x="16" y="140" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFF">European AI</text>
      <text x="16" y="160" font-family="Inter, Arial, sans-serif" font-size="10" fill="#FFF" opacity="0.85">12 min read · today · trending #1</text>
      <text x="16" y="176" font-family="Inter, Arial, sans-serif" font-size="10" fill="#FFF" opacity="0.85">by Anya Kowalski</text>
    </g>

    <!-- article rows -->
    <g transform="translate(28,348)">
      <rect width="60" height="60" rx="6" fill="#FF4FA3"/>
      <text x="30" y="36" font-family="Inter, Arial, sans-serif" font-size="22" fill="#FFF" text-anchor="middle">📈</text>
      <text x="74" y="14" font-family="Inter, Arial, sans-serif" font-size="9" letter-spacing="2" fill="#FF4FA3">BUSINESS · 6 MIN</text>
      <text x="74" y="32" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFF">Romania's tech corridor</text>
      <text x="74" y="48" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFF" opacity="0.7">How Cluj-Napoca became Eastern</text>
      <text x="74" y="62" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFF" opacity="0.7">Europe's quiet hub.</text>
    </g>
    <g transform="translate(28,420)">
      <rect width="60" height="60" rx="6" fill="#A259FF"/>
      <text x="30" y="36" font-family="Inter, Arial, sans-serif" font-size="22" fill="#FFF" text-anchor="middle">🎬</text>
      <text x="74" y="14" font-family="Inter, Arial, sans-serif" font-size="9" letter-spacing="2" fill="#A259FF">CULTURE · 4 MIN</text>
      <text x="74" y="32" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFF">A24's quiet October</text>
      <text x="74" y="48" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFF" opacity="0.7">Why the studio is leaning into</text>
      <text x="74" y="62" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFF" opacity="0.7">slower theatrical windows.</text>
    </g>
    <g transform="translate(28,492)">
      <rect width="60" height="60" rx="6" fill="#0EA5E9"/>
      <text x="30" y="36" font-family="Inter, Arial, sans-serif" font-size="22" fill="#FFF" text-anchor="middle">⚡</text>
      <text x="74" y="14" font-family="Inter, Arial, sans-serif" font-size="9" letter-spacing="2" fill="#0EA5E9">TECH · 3 MIN</text>
      <text x="74" y="32" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFF">Offline-first is back</text>
      <text x="74" y="48" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFF" opacity="0.7">Apps are sync-engine first now.</text>
    </g>

    <!-- tab bar -->
    <g transform="translate(8,576)">
      <rect width="304" height="56" rx="0" fill="#000"/>
      <text x="50" y="32" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FF4FA3" text-anchor="middle">⌂</text>
      <text x="50" y="48" font-family="Inter, Arial, sans-serif" font-size="9" fill="#FF4FA3" text-anchor="middle" font-weight="700">Home</text>
      <text x="120" y="32" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFF" opacity="0.5" text-anchor="middle">★</text>
      <text x="120" y="48" font-family="Inter, Arial, sans-serif" font-size="9" fill="#FFF" opacity="0.5" text-anchor="middle">Saved</text>
      <text x="190" y="32" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFF" opacity="0.5" text-anchor="middle">📂</text>
      <text x="190" y="48" font-family="Inter, Arial, sans-serif" font-size="9" fill="#FFF" opacity="0.5" text-anchor="middle">Offline</text>
      <text x="260" y="32" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFF" opacity="0.5" text-anchor="middle">⚙</text>
      <text x="260" y="48" font-family="Inter, Arial, sans-serif" font-size="9" fill="#FFF" opacity="0.5" text-anchor="middle">Settings</text>
    </g>
  </g>

  <!-- right phone: article view -->
  <g transform="translate(740,90)">
    <rect width="320" height="640" rx="40" fill="#000"/>
    <rect x="8" y="8" width="304" height="624" rx="32" fill="#FFFFFF"/>
    <rect x="120" y="14" width="80" height="20" rx="10" fill="#000"/>

    <!-- status -->
    <g transform="translate(8,52)">
      <text x="20" y="14" font-family="Inter, Arial, sans-serif" font-size="11" fill="#0F1A2F" font-weight="700">9:42</text>
      <text x="266" y="14" font-family="Inter, Arial, sans-serif" font-size="11" fill="#0F1A2F">●●●●</text>
    </g>

    <!-- top -->
    <g transform="translate(8,76)">
      <text x="20" y="22" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0F1A2F">←</text>
      <text x="278" y="22" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0F1A2F">⋮</text>
      <text x="250" y="22" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FF4FA3">★</text>
    </g>

    <!-- hero image -->
    <g transform="translate(8,108)">
      <rect width="304" height="160" fill="url(#phoneSky)"/>
      <rect width="304" height="160" fill="#000" fill-opacity="0.25"/>
      <text x="20" y="34" font-family="Inter, Arial, sans-serif" font-size="9" letter-spacing="3" fill="#FFF" opacity="0.9">TECH · FEATURE</text>
      <text x="20" y="100" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFF">The next decade</text>
      <text x="20" y="124" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFF">of European AI</text>
    </g>

    <!-- meta -->
    <g transform="translate(20,288)" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5C6B85">
      <circle cx="14" cy="8" r="12" fill="#A259FF"/>
      <text x="14" y="12" font-size="11" fill="#FFF" text-anchor="middle" font-weight="700">A</text>
      <text x="34" y="6" fill="#0F1A2F" font-weight="700" font-size="11">Anya Kowalski</text>
      <text x="34" y="20" font-size="9">12 min · published today · saved offline</text>
    </g>

    <!-- body text suggestion -->
    <g transform="translate(20,332)" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0F1A2F">
      <text>Europe spent the last decade losing</text>
      <text y="18">the consumer-AI race to American</text>
      <text y="36">labs. The next decade looks different.</text>
      <text y="58" fill="#5C6B85">Three forces — energy independence,</text>
      <text y="74" fill="#5C6B85">a deeper engineering bench, and the</text>
      <text y="90" fill="#5C6B85">EU AI Act's clarity — are quietly</text>
      <text y="106" fill="#5C6B85">tilting the playing field.</text>
    </g>

    <!-- pullquote -->
    <g transform="translate(20,460)">
      <rect width="284" height="64" rx="4" fill="#F4F6F8"/>
      <line x1="0" y1="0" x2="0" y2="64" stroke="#FF4FA3" stroke-width="3"/>
      <text x="14" y="22" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#0F1A2F">"The advantage isn't speed.</text>
      <text x="14" y="40" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#0F1A2F">It's the boring stuff Americans</text>
      <text x="14" y="58" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#0F1A2F">stopped caring about."</text>
    </g>

    <!-- reading progress + bottom -->
    <g transform="translate(8,548)">
      <rect width="304" height="3" fill="#F4F6F8"/>
      <rect width="120" height="3" fill="#FF4FA3"/>
    </g>
    <g transform="translate(8,564)">
      <rect width="304" height="68" fill="#FFF"/>
      <line x1="0" y1="0" x2="304" y2="0" stroke="#F4F6F8"/>
      <rect x="20" y="14" width="120" height="40" rx="20" fill="#0F1A2F"/>
      <text x="80" y="38" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle" font-weight="700">▶ LISTEN · 12m</text>
      <text x="170" y="36" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0F1A2F">📤</text>
      <text x="200" y="36" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0F1A2F">💬 24</text>
      <text x="250" y="36" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FF4FA3">★ Saved</text>
    </g>
  </g>

  <!-- center label -->
  <g transform="translate(600,400)" font-family="Inter, Arial, sans-serif" fill="#FFF" opacity="0.6">
    <text font-size="11" letter-spacing="3" text-anchor="middle">iOS · ANDROID</text>
    <text y="20" font-size="11" letter-spacing="3" text-anchor="middle">REACT NATIVE</text>
    <text y="40" font-size="11" letter-spacing="3" text-anchor="middle">ONE CODEBASE</text>
  </g>

  <g transform="translate(20,750)" font-family="Inter, Arial, sans-serif" fill="#FAF7F2">
    <text font-size="11" letter-spacing="3" opacity="0.6">MOBILE APP · iOS · ANDROID · REACT NATIVE · OFFLINE-FIRST</text>
  </g>
</svg>
