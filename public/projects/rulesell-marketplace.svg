<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="RuleSell marketplace UI mockup">
  <defs>
    <linearGradient id="rs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0B14"/>
      <stop offset="100%" stop-color="#1A1422"/>
    </linearGradient>
    <radialGradient id="rs-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rs-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBFAF7"/>
      <stop offset="100%" stop-color="#F1EEE6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#rs-bg)"/>
  <rect width="1200" height="800" fill="url(#rs-glow)"/>

  <!-- Browser frame -->
  <g transform="translate(60,60)">
    <rect width="1080" height="680" rx="14" fill="#FAF8F2" stroke="#000" stroke-opacity="0.18"/>
    <rect width="1080" height="40" rx="14" fill="#E8E4D8"/>
    <rect y="22" width="1080" height="18" fill="#E8E4D8"/>
    <circle cx="22" cy="20" r="6" fill="#FF5F57"/>
    <circle cx="42" cy="20" r="6" fill="#FEBC2E"/>
    <circle cx="62" cy="20" r="6" fill="#28C840"/>
    <rect x="92" y="10" width="540" height="20" rx="10" fill="#FFF" stroke="#000" stroke-opacity="0.08"/>
    <text x="106" y="24" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3a3a3a">rulesell.com / browse / coding-agent-rules</text>

    <!-- Top nav -->
    <g transform="translate(0,40)">
      <rect width="1080" height="56" fill="#FFFEFB" stroke="#E8E4D8"/>
      <text x="36" y="34" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#0B0A07" letter-spacing="-0.02em">RuleSell<tspan fill="#7C5CFF">.</tspan></text>
      <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#3A3A3A" transform="translate(230,34)">
        <text>Browse</text>
        <text x="80">Publish</text>
        <text x="160">Pricing</text>
        <text x="240">Docs</text>
      </g>
      <rect x="640" y="14" width="280" height="28" rx="14" fill="#F4F1E8"/>
      <text x="660" y="32" font-family="Inter, Arial, sans-serif" font-size="11" fill="#7A7466">⌕  Search 2,140 rulesets, agents, skills…</text>
      <rect x="940" y="14" width="116" height="28" rx="14" fill="#0B0A07"/>
      <text x="998" y="32" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FAF8F2" text-anchor="middle" font-weight="600">Sign in</text>
    </g>

    <!-- Headline strip -->
    <g transform="translate(36,118)">
      <text font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#7C5CFF">MARKETPLACE · CODING AGENT RULES</text>
      <text y="36" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900" fill="#0B0A07" letter-spacing="-0.02em">2,140 configs from 312 creators.</text>
      <text y="62" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5A574C">Audited rulesets, MCP skills and agent fleets for Claude Code, Cursor and Codex.</text>
    </g>

    <!-- Filter chips -->
    <g transform="translate(36,210)" font-family="Inter, Arial, sans-serif" font-size="11">
      <rect width="100" height="28" rx="14" fill="#0B0A07"/>
      <text x="50" y="18" fill="#FAF8F2" text-anchor="middle">All · 2,140</text>
      <g transform="translate(112,0)" fill="#3A3A3A">
        <rect width="92" height="28" rx="14" fill="#FFFEFB" stroke="#D6D1C2"/>
        <text x="46" y="18" text-anchor="middle">Claude · 1,124</text>
      </g>
      <g transform="translate(216,0)" fill="#3A3A3A">
        <rect width="80" height="28" rx="14" fill="#FFFEFB" stroke="#D6D1C2"/>
        <text x="40" y="18" text-anchor="middle">Cursor · 612</text>
      </g>
      <g transform="translate(308,0)" fill="#3A3A3A">
        <rect width="80" height="28" rx="14" fill="#FFFEFB" stroke="#D6D1C2"/>
        <text x="40" y="18" text-anchor="middle">Codex · 218</text>
      </g>
      <g transform="translate(400,0)" fill="#3A3A3A">
        <rect width="98" height="28" rx="14" fill="#FFFEFB" stroke="#D6D1C2"/>
        <text x="49" y="18" text-anchor="middle">MCP servers · 186</text>
      </g>
    </g>

