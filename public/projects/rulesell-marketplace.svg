      <g>
        <rect width="320" height="180" rx="10" fill="url(#rs-card)" stroke="#D6D1C2"/>
        <rect width="320" height="80" rx="10" fill="#1F1B33"/>
        <rect y="70" width="320" height="10" fill="#1F1B33"/>
        <text x="22" y="38" font-size="11" letter-spacing="2" fill="#A89BFF">RULESET · CLAUDE CODE</text>
        <text x="22" y="62" font-size="16" font-weight="800" fill="#FAF8F2">Velkina Anti-Laziness Pack</text>
        <text x="22" y="104" font-size="13" font-weight="800" fill="#0B0A07">$24</text>
        <text x="60" y="104" font-size="11" fill="#7A7466">· one-time</text>
        <text x="22" y="126" font-size="11" fill="#5A574C">312 installs · 4.9 ★ · audited</text>
        <text x="22" y="146" font-size="10" fill="#7A7466">by @nalba</text>
        <rect x="240" y="138" width="64" height="22" rx="11" fill="#7C5CFF"/>
        <text x="272" y="152" font-size="10" fill="#FFF" text-anchor="middle" font-weight="700">Install →</text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(340,0)">
        <rect width="320" height="180" rx="10" fill="url(#rs-card)" stroke="#D6D1C2"/>
        <rect width="320" height="80" rx="10" fill="#0F2C2A"/>
        <rect y="70" width="320" height="10" fill="#0F2C2A"/>
        <text x="22" y="38" font-size="11" letter-spacing="2" fill="#7FE3D2">SKILL · MCP</text>
        <text x="22" y="62" font-size="16" font-weight="800" fill="#FAF8F2">Postgres Migration Reviewer</text>
        <text x="22" y="104" font-size="13" font-weight="800" fill="#0B0A07">$0</text>
        <text x="60" y="104" font-size="11" fill="#7A7466">· free, open source</text>
        <text x="22" y="126" font-size="11" fill="#5A574C">1.2k installs · 4.7 ★ · audited</text>
        <text x="22" y="146" font-size="10" fill="#7A7466">by @baha</text>
        <rect x="240" y="138" width="64" height="22" rx="11" fill="#0B0A07"/>
        <text x="272" y="152" font-size="10" fill="#FAF8F2" text-anchor="middle" font-weight="700">Install →</text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(680,0)">
        <rect width="320" height="180" rx="10" fill="url(#rs-card)" stroke="#D6D1C2"/>
        <rect width="320" height="80" rx="10" fill="#3A1A14"/>
        <rect y="70" width="320" height="10" fill="#3A1A14"/>
        <text x="22" y="38" font-size="11" letter-spacing="2" fill="#FFB69B">AGENT · OPUS</text>
        <text x="22" y="62" font-size="16" font-weight="800" fill="#FAF8F2">Flow Auditor (UI → DB)</text>
        <text x="22" y="104" font-size="13" font-weight="800" fill="#0B0A07">$48</text>
        <text x="60" y="104" font-size="11" fill="#7A7466">· one-time</text>
        <text x="22" y="126" font-size="11" fill="#5A574C">94 installs · 5.0 ★ · audited</text>
        <text x="22" y="146" font-size="10" fill="#7A7466">by @velkina</text>
        <rect x="240" y="138" width="64" height="22" rx="11" fill="#C97B4F"/>
        <text x="272" y="152" font-size="10" fill="#FFF" text-anchor="middle" font-weight="700">Install →</text>
      </g>
      <!-- Row 2 -->
      <g transform="translate(0,200)">
        <rect width="320" height="180" rx="10" fill="url(#rs-card)" stroke="#D6D1C2"/>
        <rect width="320" height="80" rx="10" fill="#0E1A33"/>
        <text x="22" y="38" font-size="11" letter-spacing="2" fill="#8FB8D0">RULESET · CURSOR</text>
        <text x="22" y="62" font-size="16" font-weight="800" fill="#FAF8F2">Next.js 16 Hardener</text>
        <text x="22" y="104" font-size="13" font-weight="800" fill="#0B0A07">$36</text>
        <text x="60" y="104" font-size="11" fill="#7A7466">· one-time</text>
        <text x="22" y="126" font-size="11" fill="#5A574C">486 installs · 4.8 ★ · audited</text>
        <text x="22" y="146" font-size="10" fill="#7A7466">by @windcrash</text>
        <rect x="240" y="138" width="64" height="22" rx="11" fill="#7C5CFF"/>
        <text x="272" y="152" font-size="10" fill="#FFF" text-anchor="middle" font-weight="700">Install →</text>
      </g>
      <g transform="translate(340,200)">
        <rect width="320" height="180" rx="10" fill="url(#rs-card)" stroke="#D6D1C2"/>
        <rect width="320" height="80" rx="10" fill="#2A1F12"/>
        <text x="22" y="38" font-size="11" letter-spacing="2" fill="#E8B05E">SKILL · MEMORY</text>
        <text x="22" y="62" font-size="16" font-weight="800" fill="#FAF8F2">Persistent Project Memory</text>
        <text x="22" y="104" font-size="13" font-weight="800" fill="#0B0A07">$0</text>
        <text x="60" y="104" font-size="11" fill="#7A7466">· free</text>
        <text x="22" y="126" font-size="11" fill="#5A574C">2.4k installs · 4.9 ★ · audited</text>
        <text x="22" y="146" font-size="10" fill="#7A7466">by @velkina</text>
        <rect x="240" y="138" width="64" height="22" rx="11" fill="#0B0A07"/>
        <text x="272" y="152" font-size="10" fill="#FAF8F2" text-anchor="middle" font-weight="700">Install →</text>
      </g>
      <g transform="translate(680,200)">
        <rect width="320" height="180" rx="10" fill="url(#rs-card)" stroke="#D6D1C2"/>
        <rect width="320" height="80" rx="10" fill="#181024"/>
        <text x="22" y="38" font-size="11" letter-spacing="2" fill="#C9B8FF">FLEET · 6 AGENTS</text>
        <text x="22" y="62" font-size="16" font-weight="800" fill="#FAF8F2">Marketplace Bootstrapper</text>
        <text x="22" y="104" font-size="13" font-weight="800" fill="#0B0A07">$96</text>
        <text x="60" y="104" font-size="11" fill="#7A7466">· one-time</text>
        <text x="22" y="126" font-size="11" fill="#5A574C">38 installs · 4.6 ★ · audited</text>
        <text x="22" y="146" font-size="10" fill="#7A7466">by @baha</text>
        <rect x="240" y="138" width="64" height="22" rx="11" fill="#7C5CFF"/>
        <text x="272" y="152" font-size="10" fill="#FFF" text-anchor="middle" font-weight="700">Install →</text>
      </g>
    </g>
  </g>

  <!-- Bottom caption -->
  <g font-family="JetBrains Mono, monospace" fill="#9A958B" opacity="0.5">
    <text x="60" y="770" font-size="10" letter-spacing="2">RULESELL.COM · VELKINA STUDIO · 2026</text>
    <text x="1140" y="770" font-size="10" letter-spacing="2" text-anchor="end">CLAIMS · STRIPE CONNECT · AUDITED LISTINGS</text>
  </g>
</svg>
