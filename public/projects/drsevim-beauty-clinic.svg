      <text x="40" y="38" font-family="Georgia, serif" font-size="22" font-style="italic" font-weight="500" fill="#3A2A22">Dr. Sevim Aydın</text>
      <text x="40" y="54" font-family="Inter, Arial, sans-serif" font-size="9" letter-spacing="3" fill="#3A2A22" opacity="0.7">B E A U T Y · C L I N I C</text>
      <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#3A2A22">
