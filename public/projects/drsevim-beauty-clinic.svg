        <text x="0" y="150" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5A453A">Treatments designed for results that look like</text>
        <text x="0" y="170" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5A453A">you on your best day — never overdone.</text>

        <!-- popular treatments -->
        <text x="0" y="220" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#A26050">MOST BOOKED</text>
