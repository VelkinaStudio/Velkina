      <text x="975" y="38" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFF" text-anchor="middle" font-weight="600">Book online →</text>
    </g>

    <!-- hero split -->
    <g transform="translate(0,108)">
      <rect x="40" y="0" width="520" height="450" rx="6" fill="url(#hero)"/>
      <!-- portrait suggestion -->
      <g transform="translate(120,90)">
        <ellipse cx="160" cy="110" rx="110" ry="80" fill="#E5C0A2"/>
        <path d="M50,140 Q160,30 270,140 L270,260 L50,260 Z" fill="#F5E3D2"/>
        <ellipse cx="160" cy="100" rx="78" ry="92" fill="#EFC9AB"/>
        <ellipse cx="160" cy="30" rx="80" ry="36" fill="#3D2418"/>
        <path d="M80,68 Q160,18 240,68 Q240,140 230,170 Q210,180 200,150 L120,150 Q110,180 90,170 Q80,140 80,68 Z" fill="#3D2418"/>
        <ellipse cx="160" cy="110" rx="60" ry="76" fill="#EFC9AB"/>
        <ellipse cx="135" cy="106" rx="4" ry="6" fill="#3D2418"/>
        <ellipse cx="185" cy="106" rx="4" ry="6" fill="#3D2418"/>
