          <text x="16" y="22" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Botox + filler combo</text>
          <text x="16" y="38" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5A453A">60 min · from ₺6,500 · monthly slots</text>
          <text x="414" y="32" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#A26050">→</text>
        </g>

