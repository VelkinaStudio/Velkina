<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Rain Group Shopify store mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0E12"/>
      <stop offset="100%" stop-color="#1A1422"/>
    </linearGradient>
    <linearGradient id="prod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D9C2"/>
      <stop offset="100%" stop-color="#BFA683"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B2F24"/>
      <stop offset="100%" stop-color="#1F1810"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#A259FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A259FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- Browser frame -->
  <g transform="translate(60,60)">
    <rect width="1080" height="680" rx="14" fill="#FAF7F2" stroke="#000" stroke-opacity="0.15"/>
    <!-- chrome bar -->
    <rect width="1080" height="38" rx="14" fill="#EFE9DD"/>
    <rect y="20" width="1080" height="18" fill="#EFE9DD"/>
    <circle cx="20" cy="19" r="6" fill="#FF5F57"/>
    <circle cx="40" cy="19" r="6" fill="#FEBC2E"/>
    <circle cx="60" cy="19" r="6" fill="#28C840"/>
    <rect x="86" y="9" width="400" height="20" rx="10" fill="#FFF" stroke="#000" stroke-opacity="0.08"/>
    <text x="100" y="23" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3a3a3a">🔒 raingroupas.com/collections/textiles</text>

    <!-- top nav -->
    <g transform="translate(0,38)">
      <rect width="1080" height="56" fill="#FAF7F2"/>
      <text x="40" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" font-weight="700" fill="#1F1A14">Rain Group</text>
      <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#1F1A14">
        <text x="450" y="34">Shop</text>
        <text x="510" y="34">Collections</text>
        <text x="600" y="34">Lookbook</text>
        <text x="685" y="34">Journal</text>
        <text x="750" y="34">About</text>
      </g>
      <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#1F1A14">
        <rect x="880" y="18" width="50" height="22" rx="11" fill="#FFF" stroke="#1F1A14" stroke-opacity="0.15"/>
        <text x="905" y="33" text-anchor="middle">TR</text>
        <rect x="935" y="18" width="50" height="22" rx="11" fill="#1F1A14"/>
        <text x="960" y="33" text-anchor="middle" fill="#FAF7F2">EN</text>
        <text x="1000" y="33">🛍 2</text>
      </g>
      <line x1="0" y1="56" x2="1080" y2="56" stroke="#000" stroke-opacity="0.08"/>
    </g>

    <!-- hero left: product image -->
    <g transform="translate(40,118)">
      <rect width="480" height="500" rx="6" fill="url(#floor)"/>
      <!-- folded textiles stack -->
      <g>
        <rect x="80" y="380" width="320" height="50" rx="4" fill="#D9C5A7"/>
        <rect x="80" y="380" width="320" height="5" fill="#000" fill-opacity="0.12"/>
        <rect x="100" y="330" width="280" height="50" rx="4" fill="#E5D2B7"/>
        <rect x="100" y="330" width="280" height="5" fill="#000" fill-opacity="0.1"/>
        <rect x="120" y="280" width="240" height="50" rx="4" fill="#C49B6B"/>
        <rect x="120" y="280" width="240" height="5" fill="#000" fill-opacity="0.12"/>
        <rect x="140" y="230" width="200" height="50" rx="4" fill="#A87E52"/>
        <rect x="140" y="230" width="200" height="5" fill="#000" fill-opacity="0.12"/>
      </g>
      <!-- vase prop -->
      <g transform="translate(360,150)">
        <ellipse cx="40" cy="120" rx="40" ry="10" fill="#000" fill-opacity="0.35"/>
        <path d="M20,30 L20,100 Q20,118 40,118 Q60,118 60,100 L60,30 Q60,20 50,20 L30,20 Q20,20 20,30 Z" fill="#7E5832"/>
        <ellipse cx="40" cy="30" rx="20" ry="6" fill="#5C3F22"/>
        <path d="M40,30 Q44,-10 30,-25 Q26,-22 30,-10 Q34,-2 40,30 Z" fill="#3E5B2F"/>
        <path d="M40,30 Q60,5 70,-8 Q66,2 60,12 Q50,22 40,30 Z" fill="#3E5B2F"/>
      </g>
      <!-- thumbnails -->
      <g transform="translate(20,460)">
        <rect width="60" height="22" rx="2" fill="#1F1A14"/>
        <rect x="68" width="60" height="22" rx="2" fill="#FFF" stroke="#1F1A14" stroke-opacity="0.15"/>
        <rect x="136" width="60" height="22" rx="2" fill="#FFF" stroke="#1F1A14" stroke-opacity="0.15"/>
        <rect x="204" width="60" height="22" rx="2" fill="#FFF" stroke="#1F1A14" stroke-opacity="0.15"/>
      </g>
    </g>

    <!-- right: product info -->
    <g transform="translate(560,140)" font-family="Inter, Arial, sans-serif" fill="#1F1A14">
      <text x="0" y="0" font-size="11" letter-spacing="3" fill="#7A6A52">HOME COLLECTION · LINEN</text>
      <text x="0" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="600">Riviera Throw — Sand</text>
      <text x="0" y="78" font-size="22" font-weight="700">€129,00</text>
      <text x="100" y="78" font-size="13" fill="#7A6A52" text-decoration="line-through">€159,00</text>
      <rect x="160" y="62" width="58" height="22" rx="11" fill="#1F1A14"/>
      <text x="189" y="77" font-size="11" fill="#FAF7F2" text-anchor="middle" font-weight="700">-19%</text>

      <text x="0" y="120" font-size="13" fill="#3A332A">100% pure French linen, stonewashed for soft drape.</text>
      <text x="0" y="138" font-size="13" fill="#3A332A">Hand-finished hem. 140 × 200 cm.</text>

      <!-- size -->
      <text x="0" y="178" font-size="11" letter-spacing="2" fill="#7A6A52">SIZE</text>
      <g>
        <rect x="0" y="190" width="74" height="38" rx="3" fill="#1F1A14"/>
        <text x="37" y="214" font-size="13" fill="#FAF7F2" text-anchor="middle">140×200</text>
        <rect x="82" y="190" width="74" height="38" rx="3" fill="#FFF" stroke="#1F1A14" stroke-opacity="0.2"/>
        <text x="119" y="214" font-size="13" text-anchor="middle">170×220</text>
        <rect x="164" y="190" width="74" height="38" rx="3" fill="#FFF" stroke="#1F1A14" stroke-opacity="0.2"/>
        <text x="201" y="214" font-size="13" text-anchor="middle">200×260</text>
      </g>

      <!-- color -->
      <text x="0" y="262" font-size="11" letter-spacing="2" fill="#7A6A52">COLOR · SAND</text>
      <g>
        <circle cx="14" cy="286" r="14" fill="#BFA683" stroke="#1F1A14" stroke-width="2"/>
        <circle cx="46" cy="286" r="14" fill="#7E5832"/>
        <circle cx="78" cy="286" r="14" fill="#3A4738"/>
        <circle cx="110" cy="286" r="14" fill="#9CA9A4"/>
        <circle cx="142" cy="286" r="14" fill="#1F1A14"/>
      </g>

      <!-- cta -->
      <rect x="0" y="320" width="320" height="54" rx="2" fill="#1F1A14"/>
      <text x="160" y="354" font-size="14" fill="#FAF7F2" text-anchor="middle" letter-spacing="3" font-weight="700">ADD TO CART · €129,00</text>

      <rect x="0" y="384" width="320" height="42" rx="2" fill="#FAF7F2" stroke="#1F1A14" stroke-width="1.5"/>
      <text x="160" y="411" font-size="12" text-anchor="middle" letter-spacing="2">BUY NOW WITH SHOP PAY</text>

      <!-- shipping line -->
      <g transform="translate(0,448)" font-size="12" fill="#3A332A">
        <text>🚚 Free EU shipping over €120 · arrives in 3–5 days</text>
      </g>
      <g transform="translate(0,470)" font-size="12" fill="#3A332A">
        <text>↩ 30-day free returns · authentic linen guarantee</text>
      </g>
    </g>

    <!-- footer mini-stats -->
    <g transform="translate(0,640)">
      <rect width="1080" height="40" fill="#EFE9DD"/>
      <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#1F1A14">
        <text x="60" y="25" letter-spacing="2">⭐ 4.8 · 1,247 REVIEWS</text>
        <text x="340" y="25" letter-spacing="2">SHIPPING TO 23 COUNTRIES</text>
        <text x="650" y="25" letter-spacing="2">MADE IN PORTUGAL</text>
        <text x="900" y="25" letter-spacing="2">CARBON-NEUTRAL DELIVERY</text>
      </g>
    </g>
  </g>

  <!-- corner stat -->
  <g transform="translate(20,750)" font-family="Inter, Arial, sans-serif" fill="#FAF7F2">
    <text x="0" y="0" font-size="11" letter-spacing="3" opacity="0.6">SHOPIFY · MULTILINGUAL · META ADS</text>
  </g>
</svg>
