<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Clown 3D creative studio website mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0E12"/>
      <stop offset="100%" stop-color="#1A1422"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A12"/>
      <stop offset="100%" stop-color="#1B0F2E"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4FA3"/>
      <stop offset="50%" stop-color="#A259FF"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#FF4FA3" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF4FA3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow2)"/>

  <g transform="translate(60,60)">
    <rect width="1080" height="680" rx="14" fill="url(#page)" stroke="#000" stroke-opacity="0.4"/>
    <rect width="1080" height="38" rx="14" fill="#000"/>
    <rect y="20" width="1080" height="18" fill="#000"/>
    <circle cx="20" cy="19" r="6" fill="#FF5F57"/>
    <circle cx="40" cy="19" r="6" fill="#FEBC2E"/>
    <circle cx="60" cy="19" r="6" fill="#28C840"/>
    <rect x="86" y="9" width="400" height="20" rx="10" fill="#2A2A2A"/>
    <text x="100" y="23" font-family="Inter, Arial, sans-serif" font-size="11" fill="#999">🔒 clown3d.com</text>

    <!-- nav -->
    <g transform="translate(0,38)">
      <g transform="translate(40,28)">
        <circle cx="14" cy="14" r="14" fill="url(#orb)"/>
        <circle cx="12" cy="12" r="5" fill="#FFF"/>
        <text x="38" y="20" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFF" letter-spacing="2">CLOWN 3D</text>
      </g>
      <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFF" opacity="0.85">
        <text x="480" y="48">Work</text>
        <text x="525" y="48">Studio</text>
        <text x="580" y="48">Process</text>
        <text x="640" y="48">Journal</text>
      </g>
      <rect x="940" y="32" width="100" height="32" rx="16" fill="#FFF"/>
      <text x="990" y="52" font-family="Inter, Arial, sans-serif" font-size="11" fill="#000" text-anchor="middle" font-weight="800" letter-spacing="2">CONTACT</text>
    </g>

    <!-- hero left text -->
    <g transform="translate(60,140)" font-family="Inter, Arial, sans-serif" fill="#FFF">
      <text x="0" y="0" font-size="11" letter-spacing="6" opacity="0.5">EST. 2018 — ISTANBUL · LONDON</text>
      <text x="0" y="80" font-family="Sora, Inter, Arial, sans-serif" font-size="68" font-weight="800">A studio for</text>
      <text x="0" y="148" font-family="Sora, Inter, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#orb)">strange shapes</text>
      <text x="0" y="216" font-family="Sora, Inter, Arial, sans-serif" font-size="68" font-weight="800">and bold motion.</text>
      <text x="0" y="270" font-size="14" opacity="0.75">We make 3D and motion design for brands, films and ads.</text>
      <text x="0" y="290" font-size="14" opacity="0.75">Selected works for Nike, Spotify, Adidas, Apple Music, MTV.</text>

      <g transform="translate(0,330)">
        <rect width="180" height="46" rx="23" fill="#FFF"/>
        <text x="90" y="30" font-size="13" fill="#000" text-anchor="middle" font-weight="800" letter-spacing="3">SEE THE REEL ►</text>
        <text x="200" y="30" font-size="12" opacity="0.6">2:31 · sound on</text>
      </g>
    </g>

    <!-- hero right: 3D orb -->
    <g transform="translate(720,180)">
      <!-- floor shadow -->
      <ellipse cx="140" cy="290" rx="160" ry="20" fill="#000" fill-opacity="0.55"/>
      <!-- main orb -->
      <circle cx="140" cy="160" r="130" fill="url(#orb)"/>
      <circle cx="100" cy="120" r="60" fill="url(#orbGlow)"/>
      <!-- rings -->
      <ellipse cx="140" cy="160" rx="170" ry="35" fill="none" stroke="#FFF" stroke-opacity="0.18" stroke-width="2" transform="rotate(-12 140 160)"/>
      <ellipse cx="140" cy="160" rx="195" ry="50" fill="none" stroke="#00C6FF" stroke-opacity="0.45" stroke-width="1.5" transform="rotate(20 140 160)"/>
      <!-- small satellite -->
      <circle cx="280" cy="90" r="18" fill="#FF4FA3"/>
      <circle cx="285" cy="86" r="6" fill="#FFB6E1"/>
      <!-- cube -->
      <g transform="translate(20,250) rotate(15)">
        <polygon points="0,15 25,0 50,15 25,30" fill="#A259FF"/>
        <polygon points="0,15 0,40 25,55 25,30" fill="#7B3FCC"/>
        <polygon points="25,30 25,55 50,40 50,15" fill="#5C2A99"/>
      </g>
    </g>

    <!-- bottom: project thumbs -->
    <g transform="translate(60,560)">
      <text font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="6" fill="#FFF" opacity="0.5">SELECTED · 2024 — 2025</text>
      <g transform="translate(0,16)">
        <g>
          <rect width="220" height="84" rx="6" fill="#FF4FA3"/>
          <circle cx="40" cy="42" r="22" fill="#FFD1E8"/>
          <text x="78" y="34" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFF" font-weight="700">NIKE · AIR MAX</text>
          <text x="78" y="50" font-family="Inter, Arial, sans-serif" font-size="9" fill="#FFF" opacity="0.85">CGI campaign · 4 shots</text>
        </g>
        <g transform="translate(232,0)">
          <rect width="220" height="84" rx="6" fill="#1B0F2E"/>
          <polygon points="20,20 40,60 60,20 80,60 100,20" fill="#A259FF"/>
          <text x="120" y="34" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFF" font-weight="700">SPOTIFY · WRAPPED</text>
          <text x="120" y="50" font-family="Inter, Arial, sans-serif" font-size="9" fill="#FFF" opacity="0.7">3D type system</text>
        </g>
        <g transform="translate(464,0)">
          <rect width="220" height="84" rx="6" fill="#00C6FF"/>
          <rect x="20" y="20" width="40" height="44" rx="4" fill="#FFF"/>
          <rect x="68" y="30" width="32" height="34" rx="4" fill="#FFF" opacity="0.8"/>
          <text x="120" y="34" font-family="Inter, Arial, sans-serif" font-size="11" fill="#0A0A12" font-weight="700">ADIDAS · ULTRABOOST</text>
          <text x="120" y="50" font-family="Inter, Arial, sans-serif" font-size="9" fill="#0A0A12" opacity="0.7">Hero reveal · 12s film</text>
        </g>
        <g transform="translate(696,0)">
          <rect width="220" height="84" rx="6" fill="#1A1A1A"/>
          <circle cx="32" cy="42" r="22" fill="#FFD700"/>
          <text x="76" y="34" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFF" font-weight="700">MTV · IDENT 25</text>
          <text x="76" y="50" font-family="Inter, Arial, sans-serif" font-size="9" fill="#FFF" opacity="0.7">12 channel idents</text>
        </g>
        <g transform="translate(928,0)">
          <rect width="32" height="84" rx="6" fill="#FFF" fill-opacity="0.08"/>
          <text x="16" y="50" font-family="Inter, Arial, sans-serif" font-size="22" fill="#FFF" text-anchor="middle">→</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(20,750)" font-family="Inter, Arial, sans-serif" fill="#FAF7F2">
    <text font-size="11" letter-spacing="3" opacity="0.6">WEBSITE · 3D · MOTION · CREATIVE PORTFOLIO</text>
  </g>
</svg>
