      <g transform="translate(24,452)" font-family="Inter, Arial, sans-serif">
        <rect width="812" height="170" rx="8" fill="#FFF" stroke="#E5E7EB"/>
        <text x="20" y="30" font-size="11" letter-spacing="2" fill="#6B7280">CAMPAIGNS · TOP 5 BY ROAS</text>

        <g font-size="11" fill="#0B0A07">
          <g transform="translate(20,50)" fill="#6B7280" font-size="9" letter-spacing="1">
            <text>NAME</text>
            <text x="380">SPEND</text>
            <text x="460">REVENUE</text>
            <text x="560">ROAS</text>
            <text x="640">RULES</text>
            <text x="720">STATUS</text>
          </g>
          <line x1="20" y1="58" x2="792" y2="58" stroke="#E5E7EB"/>

          <g transform="translate(20,76)">
            <text font-weight="600">RG · Outdoor SS26 · Lookalike 1%</text>
            <text x="380">€3,420</text>
            <text x="460">€18,704</text>
            <text x="560" font-weight="700" fill="#16A34A">5.47×</text>
            <text x="640" font-size="10" fill="#6B7280">3 active</text>
            <rect x="720" y="-10" width="56" height="16" rx="8" fill="#DCFCE7"/>
            <text x="748" y="2" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">LIVE</text>
          </g>
          <g transform="translate(20,98)">
            <text font-weight="600">RG · Trail Boots · Interest broad</text>
            <text x="380">€2,180</text>
            <text x="460">€8,840</text>
            <text x="560" font-weight="700" fill="#16A34A">4.05×</text>
            <text x="640" font-size="10" fill="#6B7280">2 active</text>
            <rect x="720" y="-10" width="56" height="16" rx="8" fill="#DCFCE7"/>
            <text x="748" y="2" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">LIVE</text>
          </g>
          <g transform="translate(20,120)">
            <text font-weight="600">DR · Beauty retargeting · 30d</text>
            <text x="380">€1,940</text>
            <text x="460">€6,512</text>
            <text x="560" font-weight="700" fill="#16A34A">3.36×</text>
            <text x="640" font-size="10" fill="#6B7280">4 active</text>
            <rect x="720" y="-10" width="56" height="16" rx="8" fill="#DCFCE7"/>
            <text x="748" y="2" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">LIVE</text>
          </g>
          <g transform="translate(20,142)">
            <text font-weight="600">LB · QR menu app installs · IST</text>
            <text x="380">€820</text>
            <text x="460">€2,486</text>
            <text x="560" font-weight="700" fill="#16A34A">3.03×</text>
            <text x="640" font-size="10" fill="#6B7280">2 active</text>
            <rect x="720" y="-10" width="56" height="16" rx="8" fill="#FEF3C7"/>
            <text x="748" y="2" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">PACED</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g font-family="JetBrains Mono, monospace" fill="#9A958B" opacity="0.5">
    <text x="60" y="770" font-size="10" letter-spacing="2">MEGVAX · META ADS AUTOMATION · 2026</text>
    <text x="1140" y="770" font-size="10" letter-spacing="2" text-anchor="end">RAILWAY · POSTGRES · BULL QUEUE</text>
  </g>
</svg>
