<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="MegVax Meta Ads automation dashboard mockup">
  <defs>
    <linearGradient id="mv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0B14"/>
      <stop offset="100%" stop-color="#15101F"/>
    </linearGradient>
    <radialGradient id="mv-glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1877F2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1877F2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#mv-bg)"/>
  <rect width="1200" height="800" fill="url(#mv-glow)"/>

  <g transform="translate(60,60)">
    <rect width="1080" height="680" rx="14" fill="#F5F6F8" stroke="#000" stroke-opacity="0.15"/>
    <!-- titlebar -->
    <rect width="1080" height="38" rx="14" fill="#E4E6EB"/>
    <rect y="20" width="1080" height="18" fill="#E4E6EB"/>
    <circle cx="20" cy="19" r="6" fill="#FF5F57"/>
    <circle cx="40" cy="19" r="6" fill="#FEBC2E"/>
    <circle cx="60" cy="19" r="6" fill="#28C840"/>
    <rect x="86" y="9" width="500" height="20" rx="10" fill="#FFF" stroke="#000" stroke-opacity="0.08"/>
    <text x="100" y="23" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3a3a3a">app.megvax.com / campaigns / q2-acquisition</text>

    <!-- Sidebar -->
    <g transform="translate(0,38)">
      <rect width="220" height="642" fill="#0A0A0F"/>
      <text x="22" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#FAF8F2" letter-spacing="-0.02em">megvax</text>
      <text x="92" y="36" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#1877F2">META · BETA</text>

      <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#9CA3AF" transform="translate(22,80)">
        <rect x="-12" y="-14" width="200" height="28" rx="6" fill="#1F2937"/>
        <text fill="#FAF8F2">▦  Campaigns</text>
        <text y="44">⚙  Automation rules</text>
        <text y="76">⊿  Creatives</text>
        <text y="108">⌗  Audiences</text>
        <text y="140">Σ  Reports</text>
        <text y="172">⌘  Spend</text>
        <text y="216" font-size="10" letter-spacing="2" fill="#6B7280">ACCOUNT</text>
        <text y="244">▾  Rain Group</text>
        <text y="272" fill="#6B7280">+ Add ad account</text>
      </g>

      <g transform="translate(22,560)" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9CA3AF">
        <text>nalba@velkina.com</text>
        <text y="20" fill="#6B7280">Plan: Studio · 3 accounts</text>
      </g>
    </g>

    <!-- Main content -->
    <g transform="translate(220,38)">
      <rect width="860" height="642" fill="#F5F6F8"/>

      <!-- Top bar -->
      <g transform="translate(0,0)">
        <rect width="860" height="60" fill="#FFF" stroke="#E5E7EB"/>
        <text x="24" y="38" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#0B0A07" letter-spacing="-0.02em">Q2 acquisition</text>
        <rect x="200" y="22" width="84" height="22" rx="11" fill="#DCFCE7"/>
        <text x="242" y="37" font-family="Inter, Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700">● LIVE</text>
        <text x="300" y="38" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">14 campaigns · 3 ad accounts · auto-pacing on</text>

        <rect x="720" y="16" width="120" height="28" rx="14" fill="#1877F2"/>
        <text x="780" y="34" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle" font-weight="700">+ New rule</text>
      </g>

      <!-- KPI row -->
      <g transform="translate(24,84)" font-family="Inter, Arial, sans-serif">
        <g>
          <rect width="196" height="92" rx="8" fill="#FFF" stroke="#E5E7EB"/>
          <text x="16" y="26" font-size="10" letter-spacing="2" fill="#6B7280">SPEND · 7D</text>
          <text x="16" y="56" font-size="22" font-weight="800" fill="#0B0A07">€14,820</text>
          <text x="16" y="78" font-size="10" fill="#16A34A">▲ 8.4% vs last 7d</text>
        </g>
        <g transform="translate(208,0)">
          <rect width="196" height="92" rx="8" fill="#FFF" stroke="#E5E7EB"/>
          <text x="16" y="26" font-size="10" letter-spacing="2" fill="#6B7280">ROAS · 7D</text>
          <text x="16" y="56" font-size="22" font-weight="800" fill="#0B0A07">3.42×</text>
          <text x="16" y="78" font-size="10" fill="#16A34A">▲ 0.18 vs last 7d</text>
        </g>
        <g transform="translate(416,0)">
          <rect width="196" height="92" rx="8" fill="#FFF" stroke="#E5E7EB"/>
          <text x="16" y="26" font-size="10" letter-spacing="2" fill="#6B7280">CPA · 7D</text>
          <text x="16" y="56" font-size="22" font-weight="800" fill="#0B0A07">€8.14</text>
          <text x="16" y="78" font-size="10" fill="#16A34A">▼ €1.20 vs last 7d</text>
        </g>
        <g transform="translate(624,0)">
          <rect width="188" height="92" rx="8" fill="#0B0A07" stroke="#0B0A07"/>
          <text x="16" y="26" font-size="10" letter-spacing="2" fill="#A89BFF">RULES FIRED · 24H</text>
          <text x="16" y="56" font-size="22" font-weight="800" fill="#FAF8F2">38</text>
          <text x="16" y="78" font-size="10" fill="#9CA3AF">12 paused · 26 reallocated</text>
        </g>
      </g>

      <!-- Chart -->
      <g transform="translate(24,196)" font-family="Inter, Arial, sans-serif">
        <rect width="544" height="240" rx="8" fill="#FFF" stroke="#E5E7EB"/>
        <text x="20" y="30" font-size="11" letter-spacing="2" fill="#6B7280">SPEND vs REVENUE · 30 DAYS</text>
        <text x="20" y="56" font-size="13" fill="#0B0A07">Revenue tracking <tspan fill="#1877F2" font-weight="700">▲ €50,724</tspan> against <tspan font-weight="700">€14,820</tspan> spend</text>

        <!-- chart axes -->
        <line x1="40" y1="200" x2="524" y2="200" stroke="#E5E7EB"/>
        <line x1="40" y1="80" x2="524" y2="80" stroke="#E5E7EB" stroke-dasharray="2,3"/>

        <!-- revenue line -->
        <polyline points="40,170 80,160 120,150 160,140 200,120 240,130 280,110 320,100 360,90 400,95 440,80 480,72 524,60" fill="none" stroke="#1877F2" stroke-width="2.5"/>
        <polygon points="40,170 80,160 120,150 160,140 200,120 240,130 280,110 320,100 360,90 400,95 440,80 480,72 524,60 524,200 40,200" fill="#1877F2" fill-opacity="0.10"/>

        <!-- spend line -->
        <polyline points="40,185 80,182 120,180 160,176 200,170 240,172 280,165 320,162 360,158 400,160 440,154 480,150 524,146" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="4,3"/>

        <g font-size="9" fill="#9CA3AF">
          <text x="40" y="218">Apr 10</text>
          <text x="240" y="218">Apr 25</text>
          <text x="490" y="218">May 10</text>
        </g>

        <!-- legend -->
        <g transform="translate(380,30)" font-size="10">
          <rect width="12" height="3" y="6" fill="#1877F2"/>
          <text x="16" y="11" fill="#0B0A07">Revenue</text>
          <rect width="12" height="3" y="22" x="80" fill="#6B7280"/>
          <text x="96" y="27" fill="#0B0A07">Spend</text>
        </g>
      </g>

      <!-- Rules panel -->
      <g transform="translate(584,196)" font-family="Inter, Arial, sans-serif">
        <rect width="252" height="240" rx="8" fill="#FFF" stroke="#E5E7EB"/>
        <text x="20" y="30" font-size="11" letter-spacing="2" fill="#6B7280">ACTIVE RULES · 14</text>
        <g font-size="11" fill="#0B0A07" transform="translate(20,52)">
          <rect width="212" height="32" rx="6" fill="#F0F6FF"/>
          <text x="14" y="20" font-weight="600">Pause if CPA &gt; €12</text>
          <text x="14" y="32" font-size="9" fill="#6B7280">fired 8× last 24h</text>

          <g transform="translate(0,40)">
            <rect width="212" height="32" rx="6" fill="#FFF7ED"/>
            <text x="14" y="20" font-weight="600">Scale +20% if ROAS &gt; 4</text>
            <text x="14" y="32" font-size="9" fill="#6B7280">fired 4× last 24h</text>
          </g>
          <g transform="translate(0,80)">
            <rect width="212" height="32" rx="6" fill="#F5F5F5"/>
            <text x="14" y="20" font-weight="600">Refresh creative @ freq &gt; 3.5</text>
            <text x="14" y="32" font-size="9" fill="#6B7280">fired 12× last 24h</text>
          </g>
          <g transform="translate(0,120)">
            <rect width="212" height="32" rx="6" fill="#F5F5F5"/>
            <text x="14" y="20" font-weight="600">Pause on negative comments</text>
            <text x="14" y="32" font-size="9" fill="#6B7280">fired 2× last 24h</text>
          </g>
        </g>
        <text x="20" y="222" font-size="10" fill="#1877F2" font-weight="600">View all 14 rules →</text>
      </g>

