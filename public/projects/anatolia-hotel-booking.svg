<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Anatolia Hotel direct-booking website mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0E12"/>
      <stop offset="100%" stop-color="#1A1422"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB28A"/>
      <stop offset="50%" stop-color="#E97777"/>
      <stop offset="100%" stop-color="#5C3A6B"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F1A28"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#E97777" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E97777" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow4)"/>

  <g transform="translate(60,60)">
    <rect width="1080" height="680" rx="14" fill="#FFF" stroke="#000" stroke-opacity="0.15"/>
    <rect width="1080" height="38" rx="14" fill="#F4F4F6"/>
    <rect y="20" width="1080" height="18" fill="#F4F4F6"/>
    <circle cx="20" cy="19" r="6" fill="#FF5F57"/>
    <circle cx="40" cy="19" r="6" fill="#FEBC2E"/>
    <circle cx="60" cy="19" r="6" fill="#28C840"/>
    <rect x="86" y="9" width="400" height="20" rx="10" fill="#FFF" stroke="#000" stroke-opacity="0.08"/>
    <text x="100" y="23" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3a3a3a">🔒 anatoliahotel.com/book</text>

    <!-- hero image -->
    <g transform="translate(0,38)">
      <rect width="1080" height="380" fill="url(#sky)"/>
      <!-- minarets silhouette -->
      <g fill="url(#city)" opacity="0.95">
        <rect x="0" y="280" width="1080" height="100"/>
        <path d="M40,280 L40,200 L60,200 L60,280 Z"/>
        <circle cx="50" cy="195" r="14"/>
        <path d="M120,280 L120,160 L138,160 L138,280 Z"/>
        <circle cx="129" cy="155" r="12"/>
        <path d="M200,280 L200,180 L218,180 L218,280 Z"/>
        <ellipse cx="270" cy="220" rx="60" ry="50"/>
        <rect x="260" y="220" width="20" height="60"/>
        <rect x="290" y="280" width="60" height="0"/>
        <path d="M340,280 L340,170 L356,170 L356,280 Z"/>
        <circle cx="348" cy="165" r="12"/>
        <ellipse cx="450" cy="240" rx="80" ry="40"/>
        <path d="M540,280 L540,180 L556,180 L556,280 Z"/>
        <circle cx="548" cy="175" r="11"/>
        <rect x="600" y="230" width="120" height="50"/>
        <rect x="780" y="220" width="100" height="60"/>
        <rect x="920" y="240" width="140" height="40"/>
        <path d="M1000,280 L1000,180 L1018,180 L1018,280 Z"/>
        <circle cx="1009" cy="175" r="12"/>
      </g>
      <!-- sun -->
      <circle cx="780" cy="120" r="60" fill="#FFE0B5" opacity="0.9"/>
      <!-- birds -->
      <g stroke="#5C3A6B" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6">
        <path d="M200,100 Q210,93 220,100 Q230,93 240,100"/>
        <path d="M340,140 Q346,135 352,140 Q358,135 364,140"/>
      </g>

      <!-- nav over hero -->
      <g transform="translate(0,8)">
        <text x="40" y="34" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#FFF">Anatolia</text>
        <text x="40" y="52" font-family="Inter, Arial, sans-serif" font-size="9" letter-spacing="4" fill="#FFF" opacity="0.8">B O U T I Q U E   H O T E L</text>
        <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFF">
          <text x="500" y="36">Rooms</text>
          <text x="565" y="36">Restaurant</text>
          <text x="650" y="36">Spa</text>
          <text x="700" y="36">Stories</text>
          <text x="760" y="36">Contact</text>
        </g>
        <rect x="950" y="20" width="100" height="32" rx="16" fill="#FFF"/>
        <text x="1000" y="40" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5C3A6B" text-anchor="middle" font-weight="700" letter-spacing="2">BOOK</text>
      </g>

      <!-- hero copy -->
      <g transform="translate(60,150)" font-family="Georgia, serif" fill="#FFF">
        <text x="0" y="0" font-size="13" letter-spacing="6" font-family="Inter, Arial, sans-serif" opacity="0.85">SULTANAHMET · ISTANBUL</text>
        <text x="0" y="80" font-size="60" font-weight="600">Sleep over the</text>
        <text x="0" y="148" font-size="60" font-weight="600" font-style="italic">Bosphorus.</text>
        <text x="0" y="190" font-size="14" font-family="Inter, Arial, sans-serif" opacity="0.9">40 rooms · rooftop hammam · breakfast included</text>
      </g>
    </g>

    <!-- booking widget overlaid on hero bottom -->
    <g transform="translate(60,398)">
      <rect width="960" height="100" rx="8" fill="#FFF" stroke="#000" stroke-opacity="0.1" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.15))"/>
      <g font-family="Inter, Arial, sans-serif" fill="#1F1A28">
        <g transform="translate(20,20)">
          <text font-size="10" letter-spacing="2" fill="#9C8A78">CHECK IN</text>
          <text x="0" y="22" font-size="17" font-weight="700">Tue, 12 May</text>
          <text x="0" y="42" font-size="11" fill="#5A4A38">2026 · 15:00</text>
        </g>
        <line x1="180" y1="16" x2="180" y2="84" stroke="#000" stroke-opacity="0.08"/>
        <g transform="translate(200,20)">
          <text font-size="10" letter-spacing="2" fill="#9C8A78">CHECK OUT</text>
          <text x="0" y="22" font-size="17" font-weight="700">Sat, 16 May</text>
          <text x="0" y="42" font-size="11" fill="#5A4A38">2026 · 4 nights</text>
        </g>
        <line x1="360" y1="16" x2="360" y2="84" stroke="#000" stroke-opacity="0.08"/>
        <g transform="translate(380,20)">
          <text font-size="10" letter-spacing="2" fill="#9C8A78">GUESTS</text>
          <text x="0" y="22" font-size="17" font-weight="700">2 adults · 0 kids</text>
          <text x="0" y="42" font-size="11" fill="#5A4A38">Deluxe room · sea view</text>
        </g>
        <line x1="560" y1="16" x2="560" y2="84" stroke="#000" stroke-opacity="0.08"/>
        <g transform="translate(580,20)">
          <text font-size="10" letter-spacing="2" fill="#9C8A78">PROMO CODE</text>
          <text x="0" y="22" font-size="17" font-weight="700">RETURN10</text>
          <text x="0" y="42" font-size="11" fill="#22C55E">−10% returning guest</text>
        </g>
      </g>
      <rect x="760" y="20" width="180" height="60" rx="4" fill="#5C3A6B"/>
      <text x="850" y="44" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFF" text-anchor="middle" font-weight="700">€840 · 4 NIGHTS</text>
      <text x="850" y="64" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFB28A" text-anchor="middle" font-weight="600" letter-spacing="2">BOOK DIRECT →</text>
    </g>

    <!-- below: rate comparison -->
    <g transform="translate(60,538)">
      <text font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#5A4A38">SAVE WHEN YOU BOOK DIRECT</text>
      <g transform="translate(0,16)" font-family="Inter, Arial, sans-serif">
        <g>
          <rect width="220" height="78" rx="6" fill="#F6F0E8" stroke="#5C3A6B" stroke-width="2"/>
          <text x="20" y="28" font-size="11" letter-spacing="2" fill="#5A4A38">DIRECT BOOKING</text>
          <text x="20" y="56" font-size="22" font-weight="800" fill="#5C3A6B">€210 / night</text>
          <text x="20" y="70" font-size="10" fill="#22C55E">↓ €38 less than Booking.com</text>
        </g>
        <g transform="translate(232,0)">
          <rect width="160" height="78" rx="6" fill="#FFF" stroke="#000" stroke-opacity="0.1"/>
          <text x="20" y="28" font-size="11" letter-spacing="2" fill="#5A4A38" opacity="0.7">BOOKING.COM</text>
          <text x="20" y="56" font-size="20" font-weight="700" fill="#1F1A28">€248 / night</text>
          <text x="20" y="70" font-size="10" fill="#5A4A38" opacity="0.6">+ 18% commission</text>
        </g>
        <g transform="translate(404,0)">
          <rect width="160" height="78" rx="6" fill="#FFF" stroke="#000" stroke-opacity="0.1"/>
          <text x="20" y="28" font-size="11" letter-spacing="2" fill="#5A4A38" opacity="0.7">EXPEDIA</text>
          <text x="20" y="56" font-size="20" font-weight="700" fill="#1F1A28">€252 / night</text>
          <text x="20" y="70" font-size="10" fill="#5A4A38" opacity="0.6">+ 20% commission</text>
        </g>
        <g transform="translate(584,0)">
          <text y="34" font-size="13" font-weight="700" fill="#22C55E">✓ Free room upgrade subject to availability</text>
          <text y="56" font-size="13" font-weight="700" fill="#22C55E">✓ Free cancellation up to 48h before</text>
          <text y="78" font-size="13" font-weight="700" fill="#22C55E">✓ Welcome drink + late checkout</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(20,750)" font-family="Inter, Arial, sans-serif" fill="#FAF7F2">
    <text font-size="11" letter-spacing="3" opacity="0.6">WEBSITE · BOOKING ENGINE · GOOGLE ADS · DIRECT-BOOK</text>
  </g>
</svg>
