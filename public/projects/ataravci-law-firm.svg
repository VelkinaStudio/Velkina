  <g transform="translate(20,750)" font-family="Inter, Arial, sans-serif" fill="#FAF7F2">
    <text font-size="11" letter-spacing="3" opacity="0.6">WEBSITE · PERSONAL BRAND · SEO · TRUST</text>
  </g>
</svg>
