<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Atar Avcı law firm website mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0E12"/>
      <stop offset="100%" stop-color="#1A1422"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF8F3"/>
      <stop offset="100%" stop-color="#F0EAD9"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#C9A24F" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C9A24F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow3)"/>

  <g transform="translate(60,60)">
    <rect width="1080" height="680" rx="14" fill="url(#page)" stroke="#000" stroke-opacity="0.15"/>
    <rect width="1080" height="38" rx="14" fill="#EDE6D2"/>
    <rect y="20" width="1080" height="18" fill="#EDE6D2"/>
    <circle cx="20" cy="19" r="6" fill="#FF5F57"/>
    <circle cx="40" cy="19" r="6" fill="#FEBC2E"/>
    <circle cx="60" cy="19" r="6" fill="#28C840"/>
    <rect x="86" y="9" width="400" height="20" rx="10" fill="#FFF" stroke="#000" stroke-opacity="0.08"/>
    <text x="100" y="23" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3a3a3a">🔒 ataravci.com.tr</text>

    <!-- nav -->
    <g transform="translate(0,38)">
      <rect width="1080" height="62" fill="url(#page)"/>
      <g transform="translate(40,18)">
        <rect width="40" height="44" rx="2" fill="#1F2530"/>
        <text x="20" y="30" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#C9A24F" text-anchor="middle">A</text>
        <text x="52" y="22" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1F2530">Atar Avcı</text>
        <text x="52" y="38" font-family="Inter, Arial, sans-serif" font-size="9" letter-spacing="3" fill="#1F2530" opacity="0.6">H U K U K   B Ü R O S U</text>
      </g>
      <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#1F2530">
        <text x="450" y="38">Practice areas</text>
        <text x="555" y="38">Attorneys</text>
        <text x="635" y="38">Insights</text>
        <text x="700" y="38">Cases</text>
        <text x="750" y="38">Contact</text>
      </g>
      <rect x="930" y="22" width="120" height="34" rx="3" fill="#1F2530"/>
      <text x="990" y="44" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FBF8F3" text-anchor="middle" font-weight="600" letter-spacing="2">CONSULT</text>
    </g>

    <!-- hero -->
    <g transform="translate(0,110)">
      <g transform="translate(60,20)" font-family="Georgia, serif" fill="#1F2530">
        <text font-size="11" letter-spacing="6" font-family="Inter, Arial, sans-serif" fill="#C9A24F">ESTABLISHED IN ISTANBUL · SINCE 1998</text>
        <text x="0" y="70" font-size="56" font-weight="500">A law practice built on</text>
        <text x="0" y="128" font-size="56" font-weight="500" font-style="italic" fill="#C9A24F">careful counsel.</text>
        <text x="0" y="180" font-family="Inter, Arial, sans-serif" font-size="15" fill="#3F4856">Commercial, real-estate and family law for individuals</text>
        <text x="0" y="202" font-family="Inter, Arial, sans-serif" font-size="15" fill="#3F4856">and businesses across Turkey and the EU.</text>

        <g transform="translate(0,238)">
          <rect width="190" height="46" rx="2" fill="#1F2530"/>
          <text x="95" y="30" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FBF8F3" text-anchor="middle" font-weight="700" letter-spacing="3">REQUEST CONSULTATION</text>
          <rect x="202" width="160" height="46" rx="2" fill="none" stroke="#1F2530" stroke-width="1.5"/>
          <text x="282" y="30" font-family="Inter, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="600" letter-spacing="2">CALL +90 212 …</text>
        </g>

        <g transform="translate(0,308)" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#C9A24F">
          <text>BAR REGISTERED · ICC · ISTANBUL · TR · EN · DE</text>
        </g>
      </g>

      <!-- right: practice tiles -->
      <g transform="translate(680,20)" font-family="Inter, Arial, sans-serif" fill="#1F2530">
        <text font-size="11" letter-spacing="3" fill="#C9A24F">PRACTICE AREAS</text>
        <g transform="translate(0,18)">
          <rect width="350" height="80" rx="3" fill="#FFF" stroke="#1F2530" stroke-opacity="0.12"/>
          <text x="20" y="28" font-family="Georgia, serif" font-size="16" font-weight="700">Commercial litigation</text>
          <text x="20" y="48" font-size="11" fill="#3F4856">Contracts, partnerships, M&amp;A disputes — 60+ cases.</text>
          <text x="20" y="64" font-size="11" fill="#C9A24F" font-weight="600">Read more →</text>
        </g>
        <g transform="translate(0,108)">
          <rect width="350" height="80" rx="3" fill="#FFF" stroke="#1F2530" stroke-opacity="0.12"/>
          <text x="20" y="28" font-family="Georgia, serif" font-size="16" font-weight="700">Real estate &amp; construction</text>
          <text x="20" y="48" font-size="11" fill="#3F4856">Title work, lease disputes, construction litigation.</text>
          <text x="20" y="64" font-size="11" fill="#C9A24F" font-weight="600">Read more →</text>
        </g>
        <g transform="translate(0,198)">
          <rect width="350" height="80" rx="3" fill="#FFF" stroke="#1F2530" stroke-opacity="0.12"/>
          <text x="20" y="28" font-family="Georgia, serif" font-size="16" font-weight="700">Family &amp; inheritance</text>
          <text x="20" y="48" font-size="11" fill="#3F4856">Divorce, custody, estates &amp; succession planning.</text>
          <text x="20" y="64" font-size="11" fill="#C9A24F" font-weight="600">Read more →</text>
        </g>
        <g transform="translate(0,288)">
          <rect width="350" height="80" rx="3" fill="#FFF" stroke="#1F2530" stroke-opacity="0.12"/>
          <text x="20" y="28" font-family="Georgia, serif" font-size="16" font-weight="700">Foreign nationals &amp; investment</text>
          <text x="20" y="48" font-size="11" fill="#3F4856">Residence, citizenship, work permits, FDI.</text>
          <text x="20" y="64" font-size="11" fill="#C9A24F" font-weight="600">Read more →</text>
        </g>
      </g>
    </g>

    <!-- footer trust strip -->
    <g transform="translate(0,632)">
      <rect width="1080" height="48" fill="#1F2530"/>
      <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#FBF8F3" letter-spacing="2">
        <text x="60" y="30">⚖ 27 YEARS</text>
        <text x="230" y="30">800+ CASES CLOSED</text>
        <text x="450" y="30">★ 4.9 LAWYER REVIEWS</text>
        <text x="700" y="30">RESPONDS IN &lt; 24 HOURS</text>
        <text x="950" y="30" fill="#C9A24F">— EN/TR/DE</text>
      </g>
    </g>
